<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Access and Households Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Layout: sticky top bar with role switch, left nav rail (horizontal strip on phones), content column of cards and tables. */
:root{
  --bg:#FFFFFF; --surface:#F4F8F5; --surface-2:#E9F2EC; --line:#DAE6DE; --fg:#13241B; --muted:#5A6D62;
  --accent:#1C7A4A; --accent-strong:#135B36; --accent-soft:#E2F1E8; --on-accent:#FFFFFF;
  --ok:#1C7A4A; --ok-bg:#E2F1E8; --warn:#8F5B00; --warn-bg:#FCF0D6; --bad:#B42318; --bad-bg:#FDE7E4; --info:#1F5E8C; --info-bg:#E3EEF8;
  --chart-2:#A9CDB8; --paper:#FFFFFF; --scrim:rgba(10,25,17,.45);
  --shadow:0 1px 2px rgba(19,36,27,.05),0 6px 20px rgba(19,36,27,.06);
  --f-head:"Plus Jakarta Sans",Inter,system-ui,sans-serif; --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--accent)}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:800}
h2{font-size:1.1rem;font-weight:700}
h3{font-size:.98rem;font-weight:700}
p{margin:0}
.num,td.money,.money{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--accent);color:var(--on-accent)}
.top .logo{background:var(--on-accent)} .top .logo svg{stroke:var(--accent)}
.top .brand small,.top .who,.top .who-admin{color:rgba(255,255,255,.8)}
.top .seg{background:rgba(255,255,255,.16)} .top .seg button{color:rgba(255,255,255,.85)}
.top .seg button[aria-pressed="true"]{background:var(--on-accent);color:var(--accent-strong)}
.top .bell{background:transparent;border-color:rgba(255,255,255,.4)} .top .bell svg{stroke:var(--on-accent)}
.top .who select{border-color:transparent}
.top .bellpanel{color:var(--fg)}
.top-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px;stroke:var(--on-accent)}
.brand b{font-family:var(--f-head);font-size:1rem;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.75rem}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--accent-strong);box-shadow:var(--shadow)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.who select{max-width:220px}
.who-admin{font-size:.85rem;color:var(--muted)}
.bell{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center}
.bell svg{width:18px;height:18px;stroke:var(--fg)}
.bell .dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
.bellpanel{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(100% + 6px);width:min(360px,calc(100vw - 32px));background:var(--bg);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.14);max-height:420px;overflow:auto}
.bellpanel header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.notif{padding:10px 14px;border-bottom:1px solid var(--line);font-size:.85rem}
.notif.unread{background:var(--accent-soft)}
.notif small{display:block;color:var(--muted)}

/* shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
nav.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);align-self:start}
nav.side .navlbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 12px 6px}
nav.side button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--fg)}
nav.side button:hover{background:var(--surface)}
nav.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong);font-weight:700}
.badge{background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:.7rem;font-weight:700;padding:1px 7px}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
.menu-btn{display:none;width:38px;height:38px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:transparent;cursor:pointer;place-items:center;flex:none}
.menu-btn svg{width:20px;height:20px;stroke:var(--on-accent)}
.navscrim{position:fixed;inset:0;background:var(--scrim);z-index:39}
@media (max-width:860px){
  .shell{grid-template-columns:172px minmax(0,1fr);gap:16px;padding-block:16px 40px}
  nav.side button{padding:8px 10px;font-size:.88rem}
  .who span{display:none}
}
@media (max-width:640px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:grid}
  nav.side{position:fixed;top:0;bottom:0;left:0;width:min(280px,82vw);z-index:40;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 18px) 12px 18px max(12px,env(safe-area-inset-left,0px));box-shadow:4px 0 24px rgba(0,0,0,.18);transform:translateX(-105%);transition:transform .2s ease;overflow-y:auto;align-self:stretch}
  nav.side button{padding:11px 12px;font-size:.95rem}
  body.nav-open nav.side{transform:none}
}
@media (prefers-reduced-motion:reduce){nav.side{transition:none}}

/* building blocks */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph p{color:var(--muted);margin-top:4px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;display:flex;flex-direction:column;gap:14px}
.card.soft{background:var(--surface);border-color:transparent}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card-h p{color:var(--muted);font-size:.85rem}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-73{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1060px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g2,.g-73{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile.hero{background:var(--accent);color:var(--on-accent)}
.tile.hero .tile-l,.tile.hero .tile-s{color:var(--on-accent);opacity:.85}
.tile-l{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.tile-v{font-family:var(--f-head);font-size:1.55rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.tile-s{font-size:.82rem;color:var(--muted)}
.tile .btn{margin-top:8px;align-self:flex-start}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.onhero{background:var(--on-accent);color:var(--accent-strong);border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-bg)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:6px;flex-wrap:wrap}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)} .p-info{background:var(--info-bg);color:var(--info)}
.p-muted{background:var(--surface-2);color:var(--muted)}

.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--r);border:1px solid}
.alert.warn{background:var(--warn-bg);border-color:transparent;color:var(--fg)}
.alert.bad{background:var(--bad-bg);border-color:transparent}
.alert.info{background:var(--info-bg);border-color:transparent}
.alert b{display:block}
.alert .grow{flex:1;min-width:0}

.tbl{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.money,th.money{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface)}
.sub{color:var(--muted);font-size:.78rem;display:block}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:.9rem}

form.f{display:flex;flex-direction:column;gap:12px}
label.fl{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-weight:400;color:var(--fg)}
input[type=file]{font-size:.8rem;color:var(--muted);max-width:100%}
textarea{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:480px){.row2{grid-template-columns:minmax(0,1fr)}}
.check{display:flex;gap:8px;align-items:center;font-size:.88rem}
.hint{font-size:.78rem;color:var(--muted);font-weight:400}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--accent-strong);border-bottom-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);padding:5px 12px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.8rem}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}

/* QR pay */
.qrwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qrbox{background:var(--paper);padding:10px;border-radius:12px;border:1px solid var(--line);width:180px;flex:none}
.qrbox canvas,.qrbox img{display:block;width:100%;height:auto;image-rendering:pixelated}
.qrbox .qrtag{color:#13241B;text-align:center;font-size:.68rem;font-weight:700;letter-spacing:.08em;margin-top:6px}
.payee{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.payee b{font-family:var(--f-head)}
.steps{margin:0;padding-left:18px;color:var(--muted);font-size:.82rem;display:flex;flex-direction:column;gap:2px}

/* amenities */
.amen{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.amen{grid-template-columns:repeat(2,minmax(0,1fr))}}
.amen button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.amen button b{font-family:var(--f-head)}
.amen button span{font-size:.8rem;color:var(--muted)}
.amen button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.cal-h{display:flex;justify-content:space-between;align-items:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;text-align:center;color:var(--muted);padding:4px 0}
.cal button{aspect-ratio:1/1;max-width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;font-weight:600;font-size:.85rem;padding:0}
.cal button:disabled{opacity:.35;cursor:not-allowed}
.cal button .bar{width:60%;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.cal button .bar i{display:block;height:100%;background:var(--accent)}
.cal button.full .bar i{background:var(--bad)}
.cal button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.cal button[aria-pressed="true"] .bar{background:rgba(255,255,255,.35)}
.cal button.today{border-color:var(--accent)}
.legend{display:flex;gap:14px;font-size:.75rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:480px){.slots{grid-template-columns:minmax(0,1fr)}}
.slot{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;position:relative}
.slot input{position:absolute;opacity:0;pointer-events:none}
.slot-t{font-weight:700;font-variant-numeric:tabular-nums}
.slot-s{font-size:.75rem;color:var(--ok)}
.slot.taken{background:var(--surface);cursor:not-allowed}
.slot.taken .slot-s{color:var(--muted)}
.slot:has(input:checked){border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.slot:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.feebox{background:var(--surface);border-radius:8px;padding:10px 12px;font-size:.84rem}

/* vehicles */
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.vcard{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.plate{background:var(--paper);color:#13241B;border:2px solid #13241B;border-radius:6px;padding:4px 10px 6px;text-align:center;align-self:flex-start;min-width:150px}
.plate small{display:block;font-size:.56rem;letter-spacing:.3em;font-weight:700;color:#1C7A4A}
.plate b{font-family:var(--f-head);font-size:1.3rem;letter-spacing:.08em}
.vmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* tickets */
details.tk{border:1px solid var(--line);border-radius:var(--r)}
details.tk summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
details.tk summary::-webkit-details-marker{display:none}
details.tk[open] summary{border-bottom:1px solid var(--line)}
.tk-body{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.timeline{display:flex;flex-direction:column;gap:10px;border-left:2px solid var(--line);margin-left:4px;padding-left:14px}
.timeline div{position:relative;font-size:.85rem}
.timeline div::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.timeline small{color:var(--muted);display:block}
.thumb{max-width:220px;border-radius:8px;border:1px solid var(--line)}

/* announcements */
.news{display:flex;flex-direction:column;gap:2px}
.news article{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.news article:last-child{border-bottom:0}
.news time{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid line{stroke:var(--line)}
.hbar{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.84rem}
.hbar .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--accent);border-radius:5px}

.fund{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fund div{padding:14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.fund div:last-child{border-right:0;background:var(--accent-soft)}
.fund span{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.fund b{font-family:var(--f-head);font-size:1.1rem;font-variant-numeric:tabular-nums}
@media (max-width:760px){.fund{grid-template-columns:minmax(0,1fr)}.fund div{border-right:0;border-bottom:1px solid var(--line)}}

/* letter */
.letter{background:var(--paper);color:#1d1d1d;padding:36px 40px;border-radius:4px;border:1px solid var(--line);font-family:Georgia,"Times New Roman",serif;font-size:.92rem;line-height:1.6;display:flex;flex-direction:column;gap:12px}
.letter .lh{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #1C7A4A;padding-bottom:10px;flex-wrap:wrap}
.letter .lh b{font-family:var(--f-head);color:#135B36;font-size:1.05rem}
.letter .lh small{display:block;color:#555;font-family:var(--f-body);font-size:.75rem}
.letter h4{margin:4px 0 0;font-family:var(--f-head);letter-spacing:.06em;text-transform:uppercase;font-size:.95rem;color:#135B36}
.letter h4.final{color:#B42318}
.letter table{font-family:var(--f-body);font-size:.8rem;color:#1d1d1d}
.letter th{color:#555;border-color:#ddd}.letter td{border-color:#eee}
@media (max-width:560px){.letter{padding:20px}}

/* modal + toast */
.modal-wrap{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding-block:calc(env(safe-area-inset-top,0px) + 40px) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--bg);border-radius:14px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
.modal.wide{width:min(760px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px}
.modal-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.x{border:0;background:none;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--muted)}
.proof{max-width:100%;max-height:70vh;margin:0 auto;display:block;border-radius:8px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:.88rem}

{id:'1A',req:'REQ-001',dev:'phone',opt:'rec',title:'Sign in (Option A: email and password, or Google)',scn:'"A linked homeowner signs in with Google" and "…with email and password".',note:'Google first because most homeowners use Android phones. Password managers work because the fields use the right autocomplete values.',html:()=>signIn('ok')},
{id:'1B',req:'REQ-001',dev:'phone',opt:'alt',title:'Option B: email sign-in link',scn:'Option B only. Shown for comparison.',note:'Every sign-in waits for an email. On phones the link often opens inside the email app’s own browser, which is why this isn’t recommended.',html:()=>signTop()+`<div style="padding-inline:16px"><div class="signbox"><h1>Check your email</h1><p>We sent a sign-in link to <b>juan@example.com</b>. Open it on this phone to sign in.</p><div class="alert warn"><div class="grow"><b>Opened the link and you're still here?</b>Your email app may have opened it in its own browser. Copy the link into Chrome or Safari instead.</div></div><button class="btn big" type="button">Send a new link</button><button class="btn link" type="button">Use a different email</button></div></div>`},
{id:'1C',req:'REQ-001',dev:'phone',opt:'alt',title:'Option C: mobile number and SMS code',scn:'Option C only. Shown for comparison.',note:'Each code sent is charged per text message, on every sign-in.',html:()=>signTop()+`<div style="padding-inline:16px"><div class="signbox"><h1>Sign in with your mobile number</h1><form class="f" onsubmit="return false"><label class="fl" for="mob">Mobile number<input id="mob" type="tel" value="0917 555 0101" inputmode="tel"></label><label class="fl" for="otp">6-digit code sent by text<input id="otp" type="text" inputmode="numeric" class="codein" value="" placeholder="••••••"></label><button class="btn primary big" type="button">Sign in</button><button class="btn link" type="button">Send the code again (in 30 s)</button></form></div></div>`},
{id:'1D',req:'REQ-001',dev:'phone',opt:'rec',title:'Wrong password',scn:'"A wrong password does not reveal whether the email exists".',note:'The same message shows for an email with no account. The email stays typed.',html:()=>signIn('bad')},
{id:'1E',req:'REQ-001',dev:'phone',opt:'rec',title:'Forgot password',scn:'"Resetting a forgotten password" and "Too many wrong passwords".',note:'Two states stacked: after the reset link is sent, and after too many attempts.',html:()=>signTop()+`<div style="padding-inline:16px"><div class="signbox"><h1>Reset your password</h1><form class="f" onsubmit="return false"><label class="fl" for="rem">Email<input id="rem" type="email" value="juan@example.com"></label><button class="btn primary big" type="button">Send reset link</button></form><div class="alert info" role="status"><div class="grow"><b>Check your email</b>If there's an account for juan@example.com, we've sent a link to reset the password. Check your spam folder too.</div></div><span class="callout">Other state</span><div class="alert bad" role="alert"><div class="grow"><b>Too many attempts.</b>Wait a while, or reset your password.</div></div><button class="btn link" type="button">Back to sign in</button></div></div>`},
{id:'1F',req:'REQ-001',dev:'phone',opt:'rec',title:'Create an account',scn:'"Creating an account", "A password that is too short" and "Creating an account with an email that already has one".',note:'After this a verification email is sent and the person lands on "Enter your invite code" (4B). No household data is shown until a code is redeemed. Firebase also refuses a short password, not only this page.',html:()=>signTop()+`<div style="padding-inline:16px"><div class="signbox"><h1>Create an account</h1><button class="gbtn" type="button">${G}Continue with Google</button><div class="or">or use your email</div><form class="f" onsubmit="return false"><label class="fl" for="cn">Your name<input id="cn" type="text" value="Ana Reyes" autocomplete="name"></label><label class="fl" for="ce">Email<input id="ce" type="email" value="ana.reyes@example.com" autocomplete="email"></label><label class="fl" for="cp">Password<span class="pwrow"><input id="cp" type="password" class="bad" value="1234567" autocomplete="new-password"><button class="btn sm" type="button">Show password</button></span></label><span class="ferr" role="alert">Use at least 8 characters</span><button class="btn primary big" type="button">Create account</button></form><span class="callout">Other state</span><div class="alert bad" role="alert"><div class="grow">There's already an account for this email. Sign in, or reset your password.</div></div><p style="text-align:center;font-size:.88rem">Already have an account? <button class="btn link" type="button">Sign in</button></p></div></div>`},
{id:'1G',req:'REQ-001',dev:'phone',opt:'rec',title:'Signed in, not linked: "Enter your invite code" (r4: one page)',scn:'"Signed in but not linked to any household" (r4: right after creating an account and after any reload).',note:'r4: this and REQ-004’s 4B are one page, headed "Enter your invite code". The only actions are entering a code and signing out. Rules deny every household read for this person.',html:notLinked},
{id:'1H',req:'REQ-001',dev:'phone',opt:'rec',title:'Sign-in states: Google open, Google window blocked, offline (r4)',scn:'r4: "While Google sign-in is open", "The browser blocks the Google window", "Offline on each signed-out page".',note:'Three states stacked. Closing the Google window shows no message at all. Form-level messages sit above the form; the email stays typed.',html:()=>signTop()+`<div style="padding-inline:16px"><div class="signbox">
  <div><h1>Sign in to ${HOA}</h1></div>
  <button class="gbtn" type="button" disabled aria-disabled="true" style="opacity:.7">${G}Opening Google…</button>
  <div class="or">or use your email</div>
  <form class="f" onsubmit="return false"><label class="fl" for="h1e">Email<input id="h1e" type="email" value="juan@example.com" autocomplete="email"></label><button class="btn primary big" type="button" disabled style="opacity:.6">Sign in</button></form>
  <span class="callout">Other state: window blocked</span>
  <div class="alert bad" role="alert"><div class="grow">Your browser blocked the Google sign-in window. Allow pop-ups for this site, or sign in with your email.</div></div>
  <span class="callout">Other state: offline</span>
  <div class="alert bad" role="alert"><div class="grow">You're offline. Connect to the internet to sign in.</div></div>
 </div></div>`},
{id:'1I',req:'REQ-001',dev:'phone',opt:'rec',title:'Opened inside an app’s own browser (r4)',scn:'r4: "Opening the portal inside an app\'s own browser".',note:'Google refuses its sign-in in embedded browsers. The Google button stays, because detection is a guess. Email and password works as usual. "Link copied" shows only once the copy worked; if copying is blocked, the address shows selected in a box.',html:()=>signTop()+`<div style="padding-inline:16px"><div class="signbox">
  <div><h1>Sign in to ${HOA}</h1></div>
  <div class="alert warn" role="status"><div class="grow">Google sign-in doesn't work inside this app. Open this page in Chrome or Safari, or sign in with your email.</div><button class="btn sm" type="button">Copy link</button></div>
  <span class="callout">After Copy link</span><p class="hint" role="status">Link copied. Paste it into Chrome or Safari.</p>
  <span class="callout">If this browser blocks copying</span><label class="fl" for="i1u">Page address<input id="i1u" type="text" readonly value="https://portal.greenfieldhomes.example/join#K7QX-M9TA"></label><span class="hint">Press and hold to copy</span>
  <button class="gbtn" type="button">${G}Continue with Google</button>
  <div class="or">or use your email</div>
  <form class="f" onsubmit="return false"><label class="fl" for="i1e">Email<input id="i1e" type="email" autocomplete="email" placeholder="you@example.com"></label><label class="fl" for="i1p">Password<span class="pwrow"><input id="i1p" type="password" autocomplete="current-password"><button class="btn sm" type="button">Show password</button></span></label><button class="btn primary big" type="button">Sign in</button></form>
 </div></div>`},
{id:'1J',req:'REQ-001',dev:'phone',opt:'rec',title:'Create account: field errors (r4)',scn:'r4: "Field checks on the sign-in, create-account and reset pages" and "After a failed check, focus goes to the first field with an error".',note:'One-field errors sit under their field. Focus goes to "Your name", the first field with an error. Nothing typed is cleared. The password shows, so the toggle reads "Hide password".',html:()=>signTop()+`<div style="padding-inline:16px"><div class="signbox"><h1>Create an account</h1><button class="gbtn" type="button">${G}Continue with Google</button><div class="or">or use your email</div><form class="f" onsubmit="return false">
  <label class="fl" for="j1n">Your name<input id="j1n" type="text" class="bad" value="" autocomplete="name" aria-invalid="true" aria-describedby="j1ne"></label><span class="ferr" id="j1ne" role="alert">Enter your name</span>
  <label class="fl" for="j1e">Email<input id="j1e" type="email" class="bad" value="ana@" autocomplete="email" aria-invalid="true" aria-describedby="j1ee"></label><span class="ferr" id="j1ee" role="alert">Enter an email address like name@example.com</span>
  <label class="fl" for="j1p">Password<span class="pwrow"><input id="j1p" type="text" value="greenfield26" autocomplete="new-password"><button class="btn sm" type="button">Hide password</button></span></label>
  <button class="btn primary big" type="button">Create account</button></form>
  <span class="callout">Other state: offline</span><div class="alert bad" role="alert"><div class="grow">You're offline. Connect to the internet to create your account.</div></div>
  <p style="text-align:center;font-size:.88rem">Already have an account? <button class="btn link" type="button">Sign in</button></p></div></div>`},
{id:'1K',req:'REQ-001',dev:'phone',opt:'rec',title:'"What’s your name?" (r4)',scn:'r4: "A Google account with no name is asked for one" and "The person record could not be saved when the account was made".',note:'Shown only when the name isn’t known: a Google profile with no name, or a person record that failed to save. Same name checks as the create-account page. Then "Enter your invite code".',html:()=>appTop({right:SOUT})+`<div style="padding-inline:16px"><div class="signbox"><div><h1>What's your name?</h1><p class="hint" style="margin-top:6px;font-size:.88rem">The admin office sees this name next to your lot.</p></div><form class="f" onsubmit="return false"><label class="fl" for="k1n">Your name<input id="k1n" type="text" value="Lito Garcia" autocomplete="name"></label><button class="btn primary big" type="button">Continue</button></form><span class="callout">While saving</span><button class="btn primary big" type="button" disabled style="opacity:.6">Saving…</button><p class="hint" style="text-align:center">Signed in as lito.garcia@example.com</p></div></div>`},
{id:'1L',req:'REQ-001',dev:'phone',opt:'rec',title:'Verification banner and "Send again" (r4)',scn:'r4: "Where the \'verify your email\' banner shows", "Sending the verification email again", "Firebase refuses another verification email".',note:'Directly under the top bar on every signed-in page, here on "Enter your invite code". Not dismissible. The text changes in place, so nothing below jumps.',html:()=>appTop({right:SOUT})+vbanner()+`<div style="padding:8px 16px 0;display:flex;flex-direction:column;gap:8px"><span class="callout">After Send again</span>${vbanner('Sent. Check your inbox.').replace('margin:12px 16px 0','margin:0')}<span class="callout">If Firebase refuses</span>${vbanner('Too many emails sent. Wait a while, then try again.').replace('margin:12px 16px 0','margin:0')}</div><div style="padding-inline:16px"><div class="signbox"><h1>Enter your invite code</h1><div class="alert info"><div class="grow"><b>Your account isn't linked to a household yet.</b>Enter the invite code from the admin office.</div></div><form class="f" onsubmit="return false"><label class="fl" for="l1c">Invite code<input id="l1c" type="text" class="codein" placeholder="XXXX-XXXX" autocomplete="off"></label><button class="btn primary big" type="button">Continue</button></form><p class="hint" style="text-align:center">Signed in as ana.reyes@example.com</p></div></div>`},
{id:'1M',req:'REQ-001',dev:'phone',opt:'rec',title:'Guard account in R1: holding page (r4, owner decision 4)',scn:'r4: "A guard account in R1".',note:'Recommended safety net only: the recommendation is not to grant the guard role until the gate screens ship. setRole also refuses the guard role until the gate release. No menu, no household data; rules refuse any read of household data or of anyone else’s staff record. A guard who is also linked to a household sees their dashboard instead.',html:()=>appTop({right:SOUT})+`<div style="padding-inline:16px"><div class="signbox"><h1>Gate screens aren't open yet</h1><p>Keep using the gate's logbook until the admin office tells you they are ready.</p><button class="btn big" type="button">Sign out</button><p class="hint" style="text-align:center">Signed in as rodel.b@example.com</p></div></div>`},

/* ---------- REQ-002 ---------- */
{id:'2A',req:'REQ-002',dev:'desk',opt:'rec',title:'What each role sees in R1',scn:'"Each role sees only its own menu".',note:'Menus for later releases appear only when those features ship. Board pages show figures with no controls that change them.',html:()=>`<div class="cols">
  ${[['Homeowner',['Dashboard','Dues & Payments','Announcements'],'Own household only'],['Admin office staff',['Dashboard','Homeowners','Announcements','Settings'],'Approvals appears only if D4 lets the office approve payments'],['Treasurer',['Dashboard','Approvals (payments)','Homeowners','Announcements','Settings (dues, QR)'],'Everything the admin office has, plus money'],['Board member',['Dashboard'],'View only. Reports and Accounting arrive in R2.'],['Guard',['Scan Pass','Visitors Inside','Today’s Log'],'R4 add-on only']].map(([r,items,ro],i)=>`<div class="rolecol"><h3>${r}</h3>${items.map((x,j)=>`<div class="it ${j===0?'on':''}">${x}</div>`).join('')}<span class="ro">${ro}</span></div>`).join('')}</div>`},
{id:'2B',req:'REQ-002',dev:'desk',opt:'rec',title:'Treasurer who is also a homeowner',scn:'"A treasurer who is also a homeowner switches views".',note:'The switch replaces the mock-up’s Homeowner | Admin | Guard switch and appears only for people who hold both.',html:()=>appTop({sub:'Resident portal',seg:`<div class="seg" role="group" aria-label="Switch view"><button type="button" aria-pressed="true">Treasurer</button><button type="button" aria-pressed="false">My household</button></div>`,right:`<span class="who-admin">Signed in as <b>Carmela Cruz</b></span>${bell(3)}`})+shell(nav('Administration',STAFFNAV,'Approvals'),ph('Approvals','Payments submitted by homeowners.')+`<section class="card"><div class="card-h"><h2>Payments waiting for approval</h2><p>3 waiting</p></div><div class="tbl"><table><thead><tr><th>Submitted</th><th>Household</th><th>Reference no.</th><th class="money">Amount</th><th></th></tr></thead><tbody><tr><td>Nov 25, 2026</td><td><b>Carlo Mendoza</b><span class="sub">Blk 5 Lot 1</span></td><td class="num">4012883219554</td><td class="money"><b>₱1,800.00</b></td><td><div class="actions"><button class="btn sm primary" type="button">Approve</button><button class="btn sm danger" type="button">Reject</button></div></td></tr></tbody></table></div></section>`)},
{id:'2C',req:'REQ-002',dev:'phone',opt:'rec',title:'No access',scn:'"Opening a staff page without the role" and REQ-001 "A homeowner cannot open another household’s page".',note:'No data is loaded behind this page: the rules refused the read.',html:()=>appTop({menu:true,right:bell(0)})+`<div style="padding-inline:16px"><div class="signbox" style="text-align:center;align-items:center"><div style="width:56px;height:56px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg></div><h1>You don't have access to this page</h1><p class="hint" style="font-size:.88rem">If you think you should, contact the admin office.</p><button class="btn primary big" type="button">Go to my dashboard</button></div></div>`},
{id:'2D',req:'REQ-002',dev:'desk',opt:'rec',title:'Settings → Staff and roles (Option B, with Option A for comparison)',scn:'"Granting a role" and "Removing a role".',note:'Option B (left) is read-only: roles change on the board’s written request. Option A (right) adds a form, recommended later with the gate add-on.',html:()=>appTop({right:`<span class="who-admin">Signed in as <b>HOA Treasurer</b></span>${bell(0)}`})+shell(nav('Administration',STAFFNAV,'Settings'),ph('Settings','Dues, QR payment details and staff.')+`<div class="grid g2"><section class="card"><div class="card-h"><h2>Staff and roles</h2><span class="mkopt rec">Option B · recommended for R1</span></div><div class="tbl"><table><thead><tr><th>Name</th><th>Role</th><th>Since</th></tr></thead><tbody><tr><td><b>Carmela Cruz</b><span class="sub">carmela@example.com</span></td><td>Treasurer</td><td>Dec 1, 2026</td></tr><tr><td><b>Paolo Aquino</b><span class="sub">paolo@example.com</span></td><td>Admin office</td><td>Dec 1, 2026</td></tr><tr><td><b>Teresa Villanueva</b><span class="sub">teresa@example.com</span></td><td>Board</td><td>Dec 1, 2026</td></tr></tbody></table></div><p class="hint">To add, change or remove a staff role, the board president asks the developer in writing.</p></section>
  <section class="card"><div class="card-h"><h2>Add staff</h2><span class="mkopt alt">Option A · later</span></div><form class="f" onsubmit="return false"><label class="fl" for="se">Email of their portal account<input id="se" type="email" value="rafael@example.com"></label><label class="fl" for="sr">Role<select id="sr"><option>Admin office</option><option>Treasurer</option><option>Board</option><option>Guard</option></select></label><button class="btn primary" type="button">Give this role</button><p class="hint">They see the new menu the next time they open the portal. A removed role stops working at once. Every change is recorded.</p></form></section></div>`)},

{id:'3A',req:'REQ-003',dev:'desk',opt:'rec',title:'Homeowners directory with link status',scn:'"Import the household list", "Search a long list", and the link status used by REQ-004.',note:'Link status is a pill with words, never colour alone. The list is paged 50 at a time.',html:()=>appTop({right:`<span class="who-admin">Signed in as <b>Paolo Aquino</b></span>${bell(0)}`})+shell(nav('Administration',STAFFNAV,'Homeowners'),ph('Homeowners','623 households · 412 linked · 160 invited · 51 not invited',`<button class="btn" type="button">Import households</button><button class="btn primary" type="button">Add household</button>`)+`<div class="card-h"><div class="chips"><button class="chip" aria-pressed="true" type="button">All (623)</button><button class="chip" aria-pressed="false" type="button">Not invited (51)</button><button class="chip" aria-pressed="false" type="button">Invite expired (9)</button><button class="chip" aria-pressed="false" type="button">Email failed (3)</button><button class="chip" aria-pressed="false" type="button">Inactive (2)</button></div><input type="search" aria-label="Search name or lot" placeholder="Search name or lot" value="blk 4" style="width:240px"></div>

  ${[['Blk 4 Lot 2','Bea Fernandez','bea@example.com · 0917 555 0114',LS.l(2),'Manage'],['Blk 4 Lot 5','Miguel Ramos','No email · 0918 555 0109',LS.ni,'Print slip'],['Blk 4 Lot 8','Nina Soriano','nina@example.com · 0919 555 0120',LS.inv('Dec 5'),'Resend'],['Blk 4 Lot 12','Juan Dela Cruz','juan@example.com · 0917 555 0101',LS.l(1),'Manage'],['Blk 4 Lot 15','Dennis Ocampo','dennis@exmaple.com · 0921 555 0133',LS.fail,'Resend'],['Blk 4 Lot 19','Joy Castillo','joy@example.com · 0917 555 0142',LS.exp,'Resend']].map(r=>`<tr class="click"><td><input type="checkbox" aria-label="Select ${r[0]}"></td><td class="num"><b>${r[0]}</b></td><td>${r[1]}</td><td><span class="sub" style="font-size:.82rem;color:var(--fg)">${r[2]}</span></td><td>${r[3]}</td><td><button class="btn sm" type="button">${r[4]}</button></td></tr>`).join('')}
  </tbody></table></div><div class="card-h"><p>Showing 6 of 6 matching "blk 4"</p><div class="actions"><button class="btn sm" type="button">Invite selected</button><button class="btn sm" type="button">Print invite slips</button></div></div></section>`)},
{id:'3B',req:'REQ-003',dev:'phone',opt:'rec',title:'Directory on a phone',scn:'"Readable on a phone".',note:'Cards instead of the table below 640 px. No sideways scrolling. Balance shows "—" until the first billing run.',html:()=>appTop({menu:true,right:bell(0)})+`<div style="padding:16px;display:flex;flex-direction:column;gap:14px">${ph('Homeowners','623 households')}<input type="search" aria-label="Search name or lot" placeholder="Search name or lot"><div class="actions"><button class="btn primary" type="button">Add household</button><button class="btn" type="button">Import</button></div><div class="hocards">${[['Blk 4 Lot 2','Bea Fernandez',LS.l(2)],['Blk 4 Lot 5','Miguel Ramos',LS.ni],['Blk 4 Lot 8','Nina Soriano',LS.inv('Dec 5')],['Blk 4 Lot 15','Dennis Ocampo',LS.fail]].map(r=>`<div class="hocard"><div class="r"><b class="num">${r[0]}</b>${r[2]}</div><span>${r[1]}</span><span class="sub">Balance —</span><div class="actions"><button class="btn sm" type="button">Open</button></div></div>`).join('')}</div></div>`},
{id:'3C',req:'REQ-003',dev:'desk',opt:'rec',title:'Import: preview before saving',scn:'"Rows with problems are shown, not imported" and "Importing a lot that already exists does not duplicate it".',note:'Nothing is saved until the admin presses the import button. The count on the button matches the rows that will be added.',html:()=>appTop({right:`<span class="who-admin">Signed in as <b>Paolo Aquino</b></span>${bell(0)}`})+shell(nav('Administration',STAFFNAV,'Homeowners'),ph('Import households','Step 2 of 3 · Check before importing',`<button class="btn" type="button">Choose a different file</button>`)+`<div class="tiles" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="tile hero"><span class="tile-l">Ready to import</span><span class="tile-v">618</span><span class="tile-s">households-2026-11.csv · 623 rows</span></div><div class="tile"><span class="tile-l">Won't be imported</span><span class="tile-v">4</span><span class="tile-s">Fix them and import again</span></div><div class="tile"><span class="tile-l">Already in the directory</span><span class="tile-v">1</span><span class="tile-s">Skipped, not changed</span></div></div>

{id:'4H',req:'REQ-004',dev:'phone',opt:'alt',title:'Option C: self-registration with proof',scn:'Option C only. Shown for comparison.',note:'Not recommended: the office would review hundreds of titles and IDs, and the portal would store copies of them.',html:()=>appTop({right:''})+`<div style="padding-inline:16px"><div class="signbox"><h1>Claim your lot</h1><form class="f" onsubmit="return false"><div class="row2"><label class="fl" for="cb">Block<input id="cb" type="text" value="2"></label><label class="fl" for="cl">Lot<input id="cl" type="text" value="7"></label></div><label class="fl" for="cr">Proof that you own or live here<input id="cr" type="file"><span class="hint">Land title, contract to sell, or a bill with this address</span></label><button class="btn primary big" type="button">Send for approval</button><p class="hint">The admin office reviews your proof, usually within 3 working days.</p></form></div></div>`}
];

const REQS=[['REQ-001','Sign in'],['REQ-002','Roles'],['REQ-003','Household directory'],['REQ-004','Invite and link']];
let cur=0;
function draw(){
  const s=S[cur];
  document.getElementById('mkreq').innerHTML=REQS.map(([r,l])=>`<button type="button" data-req="${r}" aria-pressed="${s.req===r}">${r} · ${l}</button>`).join('');
  document.getElementById('mksel').innerHTML=S.map((x,i)=>`<option value="${i}" ${i===cur?'selected':''}>${x.id} · ${x.title}</option>`).join('');
  document.getElementById('mkinfo').innerHTML=`<span class="k">${s.req} · Screen ${s.id}</span><h2>${s.title}</h2><div><span class="mkopt ${s.opt}">${s.opt==='rec'?'Recommended option':'Alternative option, for comparison'}</span></div><p><b>Shows:</b> ${s.scn}</p><p class="mknote">${s.note}</p>`;
  document.getElementById('mkstage').innerHTML=`<div class="frame ${s.dev}">${s.html()}</div>`;
  document.getElementById('mkprev').disabled=cur===0;document.getElementById('mknext').disabled=cur===S.length-1;
  try{history.replaceState(null,'','#s'+s.id)}catch(e){}
}
document.addEventListener('click',e=>{
  const r=e.target.closest('[data-req]');if(r){cur=S.findIndex(x=>x.req===r.dataset.req);draw();return}
  if(e.target.id==='mkprev'&&cur>0){cur--;draw()}
  if(e.target.id==='mknext'&&cur<S.length-1){cur++;draw()}
});
document.getElementById('mksel').addEventListener('change',e=>{cur=+e.target.value;draw()});
const h=(location.hash||'').replace('#s','');const hi=S.findIndex(x=>x.id===h);if(hi>=0)cur=hi;
draw();
})();
</script>
