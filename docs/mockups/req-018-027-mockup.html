<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Collect and Account Mockup (R2)</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* App styles: the subset of the mock-up's own CSS (index.html, and req-001-004-access-mockup.html) that these screens use, unchanged. */
:root{
  --bg:#FFFFFF; --surface:#F4F8F5; --surface-2:#E9F2EC; --line:#DAE6DE; --fg:#13241B; --muted:#5A6D62;
  --accent:#1C7A4A; --accent-strong:#135B36; --accent-soft:#E2F1E8; --on-accent:#FFFFFF;
  --ok:#1C7A4A; --ok-bg:#E2F1E8; --warn:#8F5B00; --warn-bg:#FCF0D6; --bad:#B42318; --bad-bg:#FDE7E4; --info:#1F5E8C; --info-bg:#E3EEF8;
  --chart-2:#A9CDB8; --paper:#FFFFFF; --scrim:rgba(10,25,17,.45);
  --shadow:0 1px 2px rgba(19,36,27,.05),0 6px 20px rgba(19,36,27,.06);
  --f-head:"Plus Jakarta Sans",Inter,system-ui,sans-serif; --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:800} h2{font-size:1.1rem;font-weight:700} h3{font-size:.98rem;font-weight:700}
p{margin:0}
.num,td.money,.money{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.top{position:relative;z-index:20;background:var(--accent);color:var(--on-accent)}
.top-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:var(--on-accent);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px;stroke:var(--accent)}
.brand b{font-family:var(--f-head);font-size:1rem;display:block;line-height:1.1}
.brand small{color:rgba(255,255,255,.8);font-size:.75rem}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who-admin{font-size:.85rem;color:rgba(255,255,255,.8)}
.bell{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:transparent;cursor:pointer;display:grid;place-items:center}
.bell svg{width:18px;height:18px;stroke:var(--on-accent)}
.bell .dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
.bellpanel{position:absolute;right:16px;top:calc(100% + 6px);width:min(340px,calc(100% - 32px));background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.14);z-index:30}
.bellpanel header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.notif{padding:10px 14px;border-bottom:1px solid var(--line);font-size:.85rem}
.notif.unread{background:var(--accent-soft)}
.notif small{display:block;color:var(--muted)}
.menu-btn{display:grid;width:38px;height:38px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:transparent;cursor:pointer;place-items:center;flex:none}
.menu-btn svg{width:20px;height:20px;stroke:var(--on-accent)}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;padding:24px 16px 48px}
nav.side{display:flex;flex-direction:column;gap:2px;align-self:start}
nav.side .navlbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 12px 6px}
nav.side button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--fg)}
nav.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong);font-weight:700}
.badge{background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:.7rem;font-weight:700;padding:1px 7px}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
@media (max-width:860px){.shell{grid-template-columns:minmax(0,1fr)}nav.side{display:none}}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph p{color:var(--muted);margin-top:4px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;display:flex;flex-direction:column;gap:14px}
.card.soft{background:var(--surface);border-color:transparent}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card-h p{color:var(--muted);font-size:.85rem}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-73{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1060px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g2,.g-73{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0;min-height:138px}
.tile.hero{background:var(--accent);color:var(--on-accent)}
.tile.hero .tile-l,.tile.hero .tile-s{color:var(--on-accent);opacity:.85}
.tile-l{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.tile-v{font-family:var(--f-head);font-size:1.55rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.tile-s{font-size:.82rem;color:var(--muted)}
.tile .btn{margin-top:auto;align-self:flex-start}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:36px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad-bg)}
.btn.dangerfill{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;font-size:.8rem;min-height:30px}
.btn.big{padding:12px 14px;min-height:44px;width:100%}
.btn.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;min-height:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)} .p-info{background:var(--info-bg);color:var(--info)}
.p-muted{background:var(--surface-2);color:var(--muted)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--r)}
.alert.warn{background:var(--warn-bg)} .alert.bad{background:var(--bad-bg)} .alert.info{background:var(--info-bg)} .alert.ok{background:var(--ok-bg)}
.alert b{display:block}
.alert .grow{flex:1;min-width:0}
.tbl{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
caption{text-align:left;font-size:.78rem;color:var(--muted);padding:0 8px 6px}
th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.money,th.money{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
tr.void td{color:var(--muted)} tr.void td.strike{text-decoration:line-through}
.sub{color:var(--muted);font-size:.78rem;display:block}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:.9rem;display:flex;flex-direction:column;gap:10px;align-items:center}
form.f{display:flex;flex-direction:column;gap:12px}
label.fl{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-weight:400;color:var(--fg);min-height:40px}
textarea{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:480px){.row2{grid-template-columns:minmax(0,1fr)}}
.check{display:flex;gap:8px;align-items:center;font-size:.88rem;min-height:32px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.hint{font-size:.78rem;color:var(--muted);font-weight:400}
.ferr{color:var(--bad);font-size:.78rem;font-weight:600}
input.bad,textarea.bad,select.bad{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent-strong);border-bottom-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);padding:5px 12px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.8rem;min-height:32px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}
details.tk{border:1px solid var(--line);border-radius:var(--r)}
details.tk summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
details.tk summary::-webkit-details-marker{display:none}
details.tk[open] summary{border-bottom:1px solid var(--line)}
.tk-body{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.timeline{display:flex;flex-direction:column;gap:10px;border-left:2px solid var(--line);margin-left:4px;padding-left:14px}
.timeline div{position:relative;font-size:.85rem}
.timeline div::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.timeline div.office{background:var(--surface-2);border-radius:6px;padding:6px 8px}
.timeline div.office::before{background:var(--muted)}
.timeline small{color:var(--muted);display:block}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:84px;height:64px;border-radius:8px;border:1px solid var(--line);background:linear-gradient(135deg,#cfe3d6,#9fc3ad);display:grid;place-items:center;font-size:.7rem;color:#13241B;position:relative}
.news{display:flex;flex-direction:column;gap:2px}
.news article{padding:10px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.news article:last-child{border-bottom:0}
.news time{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.hbar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.84rem}
.hbar .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--accent);border-radius:5px}
.fund{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:0}
.fund div{padding:14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.fund div:last-child{border-right:0;background:var(--accent-soft)}
.fund dt{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.fund dd{margin:0;font-family:var(--f-head);font-size:1.1rem;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:760px){.fund{grid-template-columns:minmax(0,1fr)}.fund div{border-right:0;border-bottom:1px solid var(--line)}}
.letter{background:var(--paper);color:#1d1d1d;padding:28px 32px;border-radius:4px;border:1px solid var(--line);font-family:Georgia,"Times New Roman",serif;font-size:.9rem;line-height:1.6;display:flex;flex-direction:column;gap:10px}
.letter .lh{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #1C7A4A;padding-bottom:10px;flex-wrap:wrap}
.letter .lh b{font-family:var(--f-head);color:#135B36;font-size:1.05rem}
.letter .lh small{display:block;color:#555;font-family:var(--f-body);font-size:.75rem}
.letter h4{margin:4px 0 0;font-family:var(--f-head);letter-spacing:.06em;text-transform:uppercase;font-size:.95rem;color:#135B36}
.letter h4.final{color:#B42318}
.letter table{font-family:var(--f-body);font-size:.8rem;color:#1d1d1d}
@media (max-width:560px){.letter{padding:18px}}
.modal-wrap{position:absolute;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:40px 16px}
.modal{background:var(--bg);border-radius:14px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
.modal.wide{width:min(760px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px}
.modal-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--bg);border-radius:0 0 14px 14px}
.x{border:0;background:none;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--muted);min-width:32px;min-height:32px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:.88rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:.88rem;box-shadow:0 8px 24px rgba(0,0,0,.2);align-self:center}
.req{color:var(--bad)}
</style>
<style>
/* Mockup viewer: review bar, then one screen at a time in a phone, desktop or paper frame. Same as req-001-004-access-mockup.html. */
html,body{background:#EEF3F0}
.mkbar{position:sticky;top:0;z-index:80;background:#13241B;color:#fff;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.mkbar h1{font-size:1.05rem;color:#fff}
.mkbar p{font-size:.8rem;color:rgba(255,255,255,.75)}
.mkrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mkrow select{width:auto;max-width:100%;background:#fff;color:#13241B}
.mkrow .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.mkreq{display:flex;gap:6px;flex-wrap:wrap}
.mkreq button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:4px 12px;font-weight:600;font-size:.8rem;cursor:pointer}
.mkreq button[aria-pressed="true"]{background:#fff;color:#13241B}
.mkwrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:14px}
.mkinfo{background:#fff;border:1px solid #D2DFD7;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.mkinfo .k{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#135B36}
.mkinfo h2{font-size:1.15rem}
.mkinfo p{font-size:.86rem;color:#3d4f45}
.mkopt{display:inline-flex;gap:6px;align-items:center;font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 10px}
.mkopt.rec{background:#E2F1E8;color:#135B36}.mkopt.alt{background:#FCF0D6;color:#8F5B00}
.frame{background:#fff;border:1px solid #C9D8CF;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(19,36,27,.08);position:relative;align-self:center;width:100%;min-height:200px}
.frame.phone{max-width:390px;border-radius:28px;border:8px solid #13241B}
.frame.desk{max-width:1180px}
.frame.paper{max-width:720px;border-radius:4px}
.frame.phone .shell{grid-template-columns:minmax(0,1fr);padding:16px 14px 24px}
.frame.phone nav.side{display:none}
.frame.phone .tiles{grid-template-columns:minmax(0,1fr)}
.frame.phone .fund{grid-template-columns:minmax(0,1fr)}
.frame.phone .fund div{border-right:0;border-bottom:1px solid var(--line)}
.frame.phone .row2{grid-template-columns:minmax(0,1fr)}
.frame.phone .g2,.frame.phone .g-73{grid-template-columns:minmax(0,1fr)}
.frame.phone .letter{padding:16px}
.mail{font-family:var(--f-body);background:#fff;display:flex;flex-direction:column}
.mail .mh{padding:14px 16px;border-bottom:1px solid #e5e5e5;font-size:.82rem;color:#555;display:flex;flex-direction:column;gap:2px}
.mail .mh b{color:#111;font-size:.95rem}
.mail .mb{padding:22px 18px;display:flex;flex-direction:column;gap:14px;font-size:1rem}
.mail .mf{padding:14px 18px;border-top:1px solid #e5e5e5;font-size:.8rem;color:#666}
.hocards{display:flex;flex-direction:column;gap:10px}
.hocard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.hocard .r{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.hocard .flag{min-height:1.3em;font-size:.8rem;color:var(--warn);font-weight:600}
.selbar{position:sticky;bottom:0;background:#13241B;color:#fff;border-radius:10px;padding:10px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.selbar .btn{border-color:transparent}
.membr{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.membr:last-child{border-bottom:0}
.radios{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.radios label{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;gap:8px;align-items:center;font-weight:600;font-size:.88rem;min-height:44px}
.radios label.on{border-color:var(--accent);background:var(--accent-soft)}
.bars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:180px;padding-top:10px}
.bars .m{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:.72rem;color:var(--muted)}
.bars .pair{display:flex;gap:3px;align-items:flex-end;height:130px}
.bars .pair i{display:block;width:14px;border-radius:3px 3px 0 0;background:var(--accent)}
.bars .pair i.e{background:var(--chart-2);background-image:repeating-linear-gradient(45deg,transparent 0 3px,rgba(19,36,27,.18) 3px 5px)}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.mknote{font-size:.8rem;color:#3d4f45}
.callout{font-size:.75rem;font-weight:700;color:#8F5B00;background:#FCF0D6;border-radius:6px;padding:4px 8px;align-self:flex-start}
.crt td:first-child{white-space:nowrap;font-weight:600;vertical-align:top}
</style>

<div class="mk">
  <div class="mkbar">
    <div><h1>Collect and account mockup · REQ-018 to REQ-027 (release R2)</h1><p>Draft for owner review. Sample HOA, invented people and figures only. Each screen names the REQ scenario it shows. Comment on any screen.</p></div>
    <div class="mkrow"><div class="mkreq" id="mkreq" role="group" aria-label="Requirement"></div></div>
    <div class="mkrow">
      <label for="mksel" style="font-size:.8rem;color:rgba(255,255,255,.8)">Screen</label>
      <select id="mksel"></select>
      <button class="btn sm" id="mkprev" type="button">‹ Previous</button>
      <button class="btn sm" id="mknext" type="button">Next ›</button>
    </div>
  </div>

 html:()=>mail('Payment received: OR-00093','<p>We received your payment of <b>₱1,800.00</b> on Nov 10, 2026. Your official receipt is <b>OR-00093</b>.</p>','View your receipt')},
{id:'19B',req:'REQ-019',dev:'paper',opt:'rec',title:'Email: a notice about your dues account',scn:'"Notice sent". Decision 5: link, no attachment.',note:'Neutral subject. The body gives what the homeowner needs to act: type, amount, deadline, and what to do if they already paid.',
 html:()=>mail(`${HOA}: a notice about your dues account`,'<p>A <b>1st Notice</b> was issued for your household on Dec 3, 2026.</p><p>Overdue amount: <b>₱3,600.00</b><br>Please pay on or before <b>Dec 18, 2026</b>.</p><p>If you have already paid, submit your payment in the portal so we can match it.</p>','View the letter')},
{id:'19C',req:'REQ-019',dev:'paper',opt:'rec',title:'Email: payment needs attention, and the monthly bill',scn:'"Payment rejected", "Monthly bill email (decision 3)".',note:'Two emails stacked. Only the bill email can be turned off, and its footer says how.',
 html:()=>mail('Your payment needs attention','<p>We couldn\'t approve the payment you submitted on Dec 2, 2026 for ₱1,800.00.</p><p>Reason: <b>The reference number doesn\'t match our account</b></p><p>Please check it and submit it again, or contact the admin office.</p>','Submit again')+`<div style="height:12px;background:#EEF3F0"></div>`+mail('Your December 2026 bill is ready','<p>Your December 2026 dues of <b>₱1,800.00</b> are due on <b>Dec 31, 2026</b>.</p><p>Balance including earlier months: ₱1,800.00</p>','Pay now','Turn off bill emails in Profile, Notifications.')},
{id:'19D',req:'REQ-019',dev:'desk',opt:'rec',title:'Staff: email status on a payment and on the household',scn:'"The provider refuses an email", "A bounced email is flagged", "Wording never claims delivery".',note:'Statuses are words: queued, sent, failed, bounced. Never "delivered".',
 html:()=>staff('tr','Homeowners',ph('Blk 5 Lot 1','Owner on file: Carlo Mendoza')+`<div class="grid g2"><section class="card"><div class="card-h"><h2>People with portal access</h2></div><div><div class="membr"><div><b>Carlo Mendoza</b><span class="sub">carlo@example.com</span></div>${pill('bad','Email bounced')}</div><div class="membr"><div><b>Lia Mendoza</b><span class="sub">lia@example.com</span></div>${pill('ok','Email OK')}</div></div><p class="hint">Only the person can change their sign-in email. Ask them to update it in Profile.</p></section><section class="card"><div class="card-h"><h2>Payment · OR-00093</h2>${pill('ok','Approved')}</div><dl class="kv"><dt>Amount</dt><dd>₱1,800.00</dd><dt>Approved</dt><dd>Nov 10, 2026</dd><dt>Email</dt><dd>Sent to 1 of 2 people · 1 bounced</dd></dl></section></div>`)},
{id:'19E',req:'REQ-019',dev:'phone',opt:'rec',title:'Homeowner: notification settings',scn:'"Homeowners can turn off bill emails but not account emails".',note:'One switch. Saving shows "Saving…"; on failure the switch goes back and says "Couldn\'t save. Try again."',
 html:()=>home(ph('Notifications','')+`<section class="card"><label class="check" style="justify-content:space-between"><span><b>Bill emails</b><span class="sub">An email when each month\'s bill is ready</span></span><input type="checkbox" checked role="switch" aria-label="Bill emails"></label><div><b>Payment and notice emails</b><span class="sub">Always on. These are about your account.</span></div></section>`)},
/* REQ-020 */
{id:'20A',req:'REQ-020',dev:'desk',opt:'rec',title:'Preview a 1st Notice',scn:'"Preview before sending", "Sending records a fixed letter". Decision 4: overdue amount and periods only.',note:'December 2026 is billed but not yet due, so it is not on the letter. The Send button turns into "Sending…" and is disabled while it runs. The dialog does not close on a backdrop click.',
 html:()=>staff('tr','Collections',ph('Delinquent accounts','')+`<section class="card" style="min-height:520px"></section>`,modal('1st Notice · Blk 3 Lot 2',letterBody('1st Notice',L1),`<button class="btn" type="button">Download PDF</button><button class="btn" type="button">Cancel</button><button class="btn primary" type="button">Send 1st Notice</button>`,true))},
{id:'20B',req:'REQ-020',dev:'desk',opt:'rec',title:'Payment waiting for approval',scn:'"A payment is waiting for approval (decision 5)".',note:'The warning sits in a reserved area at the top of the preview. The main button becomes "Send anyway".',
 html:()=>staff('tr','Collections',ph('Delinquent accounts','')+`<section class="card" style="min-height:520px"></section>`,modal('1st Notice · Blk 6 Lot 9',alertBox('warn','Blk 6 Lot 9 has a payment of ₱1,800.00 waiting for approval.','Review it before sending. <a href="#">Review payment</a>')+letterBody('1st Notice',{no:'N-0043',date:'Dec 3, 2026',name:'Bea Santos',lot:'Blk 6 Lot 9',amt:'₱3,400.00',dl:'Dec 18, 2026',rows:[['October 2026','Oct 31, 2026','₱1,600.00'],['November 2026','Nov 30, 2026','₱1,800.00']]}),`<button class="btn" type="button">Cancel</button><button class="btn" type="button">Send anyway</button>`,true))},
{id:'20C',req:'REQ-020',dev:'desk',opt:'rec',title:'Final Demand: second confirmation',scn:'"Final Demand asks for one more confirmation".',note:'Marked by its title and the word "Final", not only red.',
 html:()=>staff('tr','Collections',ph('Delinquent accounts','')+`<section class="card" style="min-height:420px">${letterBody('Final Demand',LFD)}</section>`,modal('Send a Final Demand to Blk 3 Lot 2?','<p>This letter says the board may refer the account to legal counsel.</p><dl class="kv"><dt>Overdue stated</dt><dd>₱5,400.00</dd><dt>Deadline</dt><dd>Dec 13, 2026</dd><dt>Notice no.</dt><dd>N-0044</dd></dl>',`<button class="btn" type="button">Cancel</button><button class="btn dangerfill" type="button">Send Final Demand</button>`))},
{id:'20D',req:'REQ-020',dev:'desk',opt:'rec',title:'Sent, and Notice history',scn:'"Sending records a fixed letter", "Nobody in the household uses the portal", "Notice history", "Withdraw a notice sent in error".',note:'Toast after sending, then the history: delivery and email status per notice; a withdrawn notice stays listed with its reason.',
 html:()=>staff('tr','Collections',ph('Notice history','')+tabs(['Delinquent accounts','Notice history'],'Notice history')+`<div class="toast" role="status">1st Notice N-0042 sent to Blk 3 Lot 2. Email queued to 2 people.</div><section class="card"><div class="tbl"><table><caption>Notices, newest first</caption><thead><tr><th>Date</th><th>Notice no.</th><th>Household</th><th>Notice</th><th class="money">Overdue stated</th><th>Delivery</th><th>Email</th><th></th></tr></thead><tbody>
 <tr><td>Dec 3, 2026</td><td class="num">N-0043</td><td>Blk 9 Lot 3</td><td>${np('Reminder')}</td><td class="money">₱1,800.00</td><td>Print</td><td><span class="sub">No email: nobody in this household uses the portal</span></td><td><div class="actions"><button class="btn sm" type="button">Download PDF</button></div></td></tr>
 <tr><td>Dec 3, 2026</td><td class="num">N-0042</td><td>Blk 3 Lot 2</td><td>${np('1st Notice')}</td><td class="money">₱3,600.00</td><td>Portal</td><td>Sent to 2 people</td><td><div class="actions"><button class="btn sm" type="button">View letter</button><button class="btn sm danger" type="button">Withdraw</button></div></td></tr>
 <tr class="void"><td>Nov 28, 2026</td><td class="num">N-0039</td><td>Blk 5 Lot 1</td><td>${np('Reminder')} ${pill('muted','Withdrawn')}<span class="sub">Paid in cash at the office on Nov 27</span></td><td class="money">₱1,800.00</td><td>Portal</td><td>Sent to 2 people</td><td><button class="btn sm" type="button">View letter</button></td></tr>
 </tbody></table></div></section>`)},
{id:'20E',req:'REQ-020',dev:'desk',opt:'rec',title:'Withdraw a notice',scn:'"Withdraw a notice sent in error (decision 6)", "Withdrawing needs a reason".',note:'Shown with the empty-reason error. The dialog keeps what was typed and does not close on a backdrop click.',
 html:()=>staff('tr','Collections',ph('Notice history','')+`<section class="card" style="min-height:360px"></section>`,modal('Withdraw notice N-0042?','<p>The letter stays on record as withdrawn and the household is told to disregard it.</p><label class="fl" for="wr">Reason<textarea id="wr" class="bad" aria-describedby="wre"></textarea></label><span class="ferr" id="wre" role="alert">Say why you\'re withdrawing this notice</span>',`<button class="btn" type="button">Cancel</button><button class="btn dangerfill" type="button">Withdraw notice</button>`))},
{id:'20F',req:'REQ-020',dev:'phone',opt:'rec',title:'Homeowner: bell and Notices received',scn:'"The homeowner sees the notice", "The letter never changes after sending".',note:'Cards instead of the mock-up\'s table. The letter opens as the stored PDF.',
 html:()=>home(ph('Dues & Payments','Blk 3 Lot 2')+`<section class="card"><div class="card-h"><h2>Notices received</h2></div><div class="hocards"><div class="hocard"><div class="r">${np('1st Notice')}<span class="sub">Dec 3, 2026</span></div><div class="r"><span>Overdue stated <b>₱3,600.00</b></span><span class="sub">Pay by Dec 18, 2026</span></div><button class="btn big" type="button">View letter</button></div></div></section>`,`<div class="bellpanel" role="region" aria-label="Notifications"><header><b>Notifications</b><button class="btn link" type="button">Mark all read</button></header><div class="notif unread">You received a 1st Notice for an overdue amount of ₱3,600.00. Please pay by Dec 18, 2026.<small>Dec 3, 2026</small></div></div>`,1)},
{id:'20G',req:'REQ-020',dev:'desk',opt:'rec',title:'Waiting for a deadline, stale preview and failures',scn:'"The next step waits for the deadline", "The household paid after the preview opened", "The overdue amount changed after the preview opened", "Sending fails".',note:'Messages stacked for review; each appears in the preview where it applies.',
 html:()=>staff('tr','Collections',ph('Delinquent accounts','')+`<section class="card"><div class="card-h"><div><b>Blk 3 Lot 2</b><span class="sub">1st Notice sent Dec 1, 2026 · deadline Dec 16, 2026</span></div><button class="btn sm" type="button" disabled>2nd Notice after Dec 16</button></div></section>${alertBox('info','Blk 3 Lot 2 is no longer delinquent.','No notice was sent.')}${alertBox('warn','The overdue amount changed to ₱1,800.00.','Check the updated letter, then send.')}${alertBox('bad','Couldn\'t send.','Nothing was recorded. Try again.','alert')}`)},
/* REQ-021 */
{id:'21A',req:'REQ-021',dev:'desk',opt:'rec',title:'Select all ready',scn:'"Select all ready", "A household that can\'t take a notice yet can\'t be ticked".',note:'Ticked: households whose next notice can go now. Not ticked: the Final Demand (one at a time), the pending payment, and the one waiting for a deadline (disabled). The selection bar is always there, so the list doesn\'t jump.',
 html:()=>staff('tr','Collections',ph('Delinquent accounts','43 delinquent households · ₱135,000.00 overdue',`<button class="btn" type="button">Select all ready</button><button class="btn" type="button">Clear selection</button>`)+`<section class="card"><div class="card-h">${chips(DELCHIPS,'All')}</div>${delTable({sel:true})}<div class="selbar" role="region" aria-label="Selection"><span><b>3 selected on this page.</b> Send these, then go to the next page.</span><button class="btn primary" type="button">Send next notice to selected</button></div></section>`)},
{id:'21B',req:'REQ-021',dev:'desk',opt:'rec',title:'Batch summary with skips',scn:'"Send to the selected households", "Final Demands are not sent in a batch", "Households with a pending payment are skipped by default".',note:'Skips are listed before sending, not discovered afterwards.',
 html:()=>staff('tr','Collections',ph('Delinquent accounts','')+`<section class="card" style="min-height:460px"></section>`,modal('Send 8 notices?','<p><b>5 Reminders · 2 1st Notices · 1 2nd Notice</b></p><div class="actions"><button class="btn sm" type="button">View sample Reminder</button><button class="btn sm" type="button">View sample 1st Notice</button><button class="btn sm" type="button">View sample 2nd Notice</button></div><div class="alert warn"><div class="grow"><b>2 skipped: Final Demands are sent one at a time</b>Blk 3 Lot 2, Blk 7 Lot 5</div></div><div class="alert warn"><div class="grow"><b>1 skipped: payment waiting for approval</b>Blk 6 Lot 9</div></div><label class="check"><input type="checkbox"> Include households with a payment waiting for approval</label>',`<button class="btn" type="button">Cancel</button><button class="btn primary" type="button">Send 8 notices</button>`))},
{id:'21C',req:'REQ-021',dev:'desk',opt:'rec',title:'Sending, then the result',scn:'"Send to the selected households", "A household paid while the batch was sending", "Some sends fail", "Leaving the page mid-batch".',note:'Progress is announced politely to screen readers. The server finishes the batch even if the tab is closed.',
 html:()=>staff('tr','Collections',ph('Delinquent accounts','')+`<section class="card" style="min-height:460px"></section>`,modal('Sending notices','<div role="status" aria-live="polite"><button class="btn primary big" type="button" disabled>Sending… 7 of 12</button></div><hr style="border:0;border-top:1px solid var(--line);width:100%"><p class="hint">When it finishes:</p>'+alertBox('ok','9 notices sent. Email queued to 14 people. 2 households need printed letters.','<button class="btn sm" type="button" style="margin-top:6px">Download 2 letters</button>')+alertBox('warn','2 couldn\'t be sent: Blk 1 Lot 3, Blk 4 Lot 8.','Nothing was recorded for them. <button class="btn sm" type="button">Try these 2 again</button>')+alertBox('info','','1 skipped: Blk 6 Lot 9 is no longer delinquent.'),`<button class="btn" type="button">Close</button>`))},
{id:'21D',req:'REQ-021',dev:'phone',opt:'rec',title:'Bulk selection on a phone',scn:'"Nothing selected", and the selection bar on a phone.',note:'The bar sticks to the bottom of the screen within thumb reach.',
 html:()=>phoneStaff('tr',ph('Delinquent accounts','43 households')+`<button class="btn" type="button">Select all ready</button><div class="hocards">${DEL.slice(0,3).map(d=>`<div class="hocard"><label class="check"><input type="checkbox" aria-label="Select ${d.lot}"><b>${d.lot}</b></label><span class="sub">${d.name} · ${d.m} months · ${d.od}</span></div>`).join('')}</div>${alertBox('warn','','Select at least one account first.','alert')}<div class="selbar"><span>Select households to send notices</span><button class="btn primary" type="button">Send</button></div>`)},
/* REQ-022 */
{id:'22A',req:'REQ-022',dev:'phone',opt:'rec',title:'Record an expense on a phone',scn:'"Record an expense", "A required field is missing", "Take the receipt photo on a phone".',note:'Shown with the vendor error; everything else typed is kept. The amount keypad is decimal. The save button shows the amount.',
 html:()=>home(ph('Record an expense','')+`<form class="f card" onsubmit="return false"><div class="row2"><label class="fl" for="ed">Date<input id="ed" type="date" value="2026-09-18"></label><label class="fl" for="ec">Category<select id="ec"><option>Repairs &amp; maintenance</option></select></label></div><label class="fl" for="ev">Vendor<input id="ev" type="text" class="bad" aria-describedby="eve"></label><span class="ferr" id="eve" role="alert">Enter who was paid</span><label class="fl" for="eds">Description<input id="eds" type="text" value="Pool pump repair"></label><label class="fl" for="ea">Amount (₱)<input id="ea" type="text" inputmode="decimal" value="7,500.00"></label><div><span class="fl">Receipt</span><div class="thumbs" style="margin-top:6px"><span class="thumb">Receipt photo</span></div><button class="btn sm" type="button" style="margin-top:8px">Change photo</button></div><label class="check"><input type="checkbox"> No receipt</label><div style="min-height:20px"></div><button class="btn primary big" type="button">Save ₱7,500.00 expense</button></form>`).replace('Resident portal','Administration')},
{id:'22B',req:'REQ-022',dev:'desk',opt:'rec',title:'Expenses for a month, with a void and a no-receipt line',scn:'"Void instead of delete", "No receipt", "There is no delete", "Edit an expense in an open month".',note:'Void stays listed, crossed out, with the word "Void" and the reason. No Delete button anywhere.',
 html:()=>staff('tr','Accounting',ph('Accounting','Collections, expenses and the association fund.',monthSel('September 2026'))+tabs(ACCTABS,'Expenses')+`<section class="card"><div class="card-h"><h2>Expenses · September 2026 · ₱28,600.00</h2><button class="btn primary" type="button">Record an expense</button></div>${expTable()}</section>`)},
{id:'22C',req:'REQ-022',dev:'desk',opt:'rec',title:'Void an expense',scn:'"Void instead of delete", "Voiding needs a reason".',note:'Same reason-dialog shape as payment voids (REQ-014).',
 html:()=>staff('tr','Accounting',ph('Accounting','')+`<section class="card" style="min-height:340px"></section>`,modal('Void this expense?','<p>It stays on record, crossed out, and is left out of every total.</p><dl class="kv"><dt>Vendor</dt><dd>AquaFix Pool Services</dd><dt>Amount</dt><dd>₱7,500.00</dd><dt>Date</dt><dd>Sep 18, 2026</dd></dl><label class="fl" for="vr">Reason<textarea id="vr">Entered twice</textarea></label>',`<button class="btn" type="button">Cancel</button><button class="btn dangerfill" type="button">Void expense</button>`))},
{id:'22D',req:'REQ-022',dev:'desk',opt:'rec',title:'Likely duplicate',scn:'"A likely duplicate (decision 5)".',note:'Nothing is saved until "Save anyway".',
 html:()=>staff('tr','Accounting',ph('Accounting','')+`<section class="card" style="min-height:300px"></section>`,modal('Already recorded?','<p>An expense of <b>₱7,500.00</b> to <b>AquaFix Pool Services</b> on <b>Sep 18, 2026</b> is already recorded. Save this one too?</p>',`<button class="btn" type="button">Cancel</button><button class="btn primary" type="button">Save anyway</button>`))},
{id:'22E',req:'REQ-022',dev:'desk',opt:'rec',title:'Closed month and upload failure',scn:'"A closed month can\'t be changed", "Upload fails", "An empty month".',note:'Three messages stacked for review.',
 html:()=>staff('tr','Accounting',ph('Accounting','',monthSel('December 2026'))+tabs(ACCTABS,'Expenses')+alertBox('bad','October 2026 is closed.','Date this in an open month, or reopen October first.','alert')+alertBox('bad','The receipt didn\'t upload.','Check your connection and try again. Your typing and the photo are kept.','alert')+`<section class="card"><div class="empty">No expenses recorded for December 2026.<button class="btn primary" type="button">Record an expense</button></div></section>`)},
/* REQ-023 */
{id:'23A',req:'REQ-023',dev:'desk',opt:'rec',title:'Collections for a month',scn:'"The month\'s total matches its receipts", "A payment made in one month and approved in the next", "A receipt voided in a later month", "Download the month as CSV".',note:'Counted by receipt date. The "Paid" column is for matching the bank. The void of a November receipt is a minus line in December, so closed November doesn\'t change.',
 html:()=>staff('tr','Accounting',ph('Accounting','Collections, expenses and the association fund.',monthSel('December 2026')+`<button class="btn" type="button">Download CSV</button>`)+tabs(ACCTABS,'Collections')+`<p class="hint">Contains household payment details. Keep it private.</p><section class="card"><div class="card-h"><h2>Dues collected · December 2026 · 3 receipts</h2></div>${collTable()}</section>`)},
{id:'23B',req:'REQ-023',dev:'phone',opt:'rec',title:'Collections on a phone',scn:'"Readable on a phone".',note:'Month total stays above the list.',
 html:()=>phoneStaff('tr',ph('Collections','December 2026 · ₱5,400.00')+`<div class="hocards">${COLL.map(c=>c[6]==='void'?`<div class="hocard"><div class="r"><b>${c[2]}</b><b class="num">${c[5]}</b></div><span class="sub">${pill('muted','Void')} ${c[0]} · ${c[7]}</span></div>`:`<div class="hocard"><div class="r"><b><a href="#">${c[1]}</a> · ${c[2]}</b><b class="num">${c[5]}</b></div><span class="sub">Receipt ${c[0]} · paid ${c[3]}</span><span class="sub" style="min-height:1.2em">${c[6]}</span></div>`).join('')}</div>`)},
{id:'23C',req:'REQ-023',dev:'desk',opt:'rec',title:'A month with no collections',scn:'"A month with no collections", "The list can\'t load".',note:'CSV is disabled when there is nothing to download.',
 html:()=>staff('tr','Accounting',ph('Accounting','',monthSel('January 2027')+`<button class="btn" type="button" disabled>Download CSV</button>`)+tabs(ACCTABS,'Collections')+`<section class="card"><div class="empty">No collections recorded for January 2027.</div></section>`+alertBox('bad','Couldn\'t load collections.','Check your connection and try again. <button class="btn sm" type="button">Try again</button>','alert'))},
/* REQ-024 */
{id:'24A',req:'REQ-024',dev:'desk',opt:'rec',title:'Fund summary, ready to close',scn:'"Closing balance", "Figures agree with their pages", "Where the money went", "Collection rate".',note:'Amenity fees join the strip once bookings exist (R3). The figures are a labelled definition list.',
 html:()=>staff('tr','Accounting',ph('Accounting','',monthSel('October 2026'))+tabs(ACCTABS,'Fund summary')+`<section class="card"><div class="card-h"><div><h2>Fund summary · October 2026</h2><p>Collection rate 55% of ₱56,070.00 billed · Includes payments for earlier months.</p></div><div class="actions">${pill('warn','Open')}<button class="btn primary" type="button">Close October 2026</button></div></div>${fundStrip({op:'₱185,000.00',du:'₱30,600.00',ex:'₱28,600.00',cl:'₱187,000.00'})}</section>`+cats())},
{id:'24B',req:'REQ-024',dev:'desk',opt:'rec',title:'Close a month with a bank difference',scn:'"The bank balance doesn\'t match (decision 4)", "Close a month with a matching bank balance".',note:'The difference updates as the balance is typed; a note is required when it isn\'t ₱0.00. The dialog does not close on a backdrop click.',
 html:()=>staff('tr','Accounting',ph('Accounting','')+`<section class="card" style="min-height:420px"></section>`,modal('Close October 2026?','<p>Nothing dated in October can be recorded, edited or voided after this.</p><dl class="kv"><dt>Closing fund balance</dt><dd>₱187,000.00</dd></dl><label class="fl" for="bb">Bank balance on Oct 31, 2026 (optional)<input id="bb" type="text" inputmode="decimal" value="186,200.00"></label><p style="min-height:1.4em;color:var(--warn);font-weight:600" role="status">Difference: ₱800.00 less in the bank than the portal shows.</p><label class="fl" for="bn">Explain the difference<textarea id="bn">Bank charges and one cheque not yet cleared</textarea></label>',`<button class="btn" type="button">Cancel</button><button class="btn primary" type="button">Close October</button>`))},
{id:'24C',req:'REQ-024',dev:'desk',opt:'rec',title:'Closed month, and reopening',scn:'"Reopen a closed month (decision 3)", "A month that hasn\'t ended can\'t be closed", "Months close in order".',note:'Behind the dialog: the closed summary. The board is told about every reopen, with the reason.',
 html:()=>staff('tr','Accounting',ph('Accounting','',monthSel('October 2026'))+tabs(ACCTABS,'Fund summary')+`<section class="card"><div class="card-h"><div><h2>Fund summary · October 2026</h2><p>Closed by Rosa Villanueva on Nov 5, 2026 · Bank balance ₱186,200.00, difference ₱800.00: Bank charges and one cheque not yet cleared</p></div><div class="actions">${pill('muted','Closed')}<button class="btn" type="button">Reopen October 2026</button></div></div>${fundStrip({op:'₱185,000.00',du:'₱30,600.00',ex:'₱28,600.00',cl:'₱187,000.00'})}</section><p class="hint">Other months: "You can close November 2026 from Dec 1." · "Close September 2026 first."</p>`,modal('Reopen October 2026?','<p>Board members will be told, with your reason.</p><label class="fl" for="ro">Reason<textarea id="ro">Expense receipt from the electrician arrived late</textarea></label>',`<button class="btn" type="button">Cancel</button><button class="btn primary" type="button">Reopen October</button>`))},
{id:'24D',req:'REQ-024',dev:'desk',opt:'rec',title:'Settings: opening fund balance',scn:'"Set the opening fund balance (decision 2)", "The opening balance is fixed after the first close", "No opening balance yet".',note:'Editable only until the first month is closed.',

const REQS=[['REQ-018','Delinquent'],['REQ-019','Email'],['REQ-020','Next notice'],['REQ-021','Bulk notices'],['REQ-022','Expense'],['REQ-023','Collections'],['REQ-024','Fund and close'],['REQ-025','Dashboard'],['REQ-026','Log request'],['REQ-027','Manage requests'],['Copy','Copy of record']];
let cur=0;
function draw(){
  const s=S[cur];
  document.getElementById('mkreq').innerHTML=REQS.map(([r,l])=>`<button type="button" data-req="${r}" aria-pressed="${s.req===r}">${r==='Copy'?l:r+' · '+l}</button>`).join('');
  document.getElementById('mksel').innerHTML=S.map((x,i)=>`<option value="${i}" ${i===cur?'selected':''}>${x.id} · ${x.title}</option>`).join('');
  document.getElementById('mkinfo').innerHTML=`<span class="k">${s.req} · Screen ${s.id}</span><h2>${s.title}</h2><div><span class="mkopt ${s.opt}">${s.opt==='rec'?'Recommended option':'Alternative option, for comparison'}</span></div><p><b>Shows:</b> ${s.scn}</p><p class="mknote">${s.note}</p>`;
  document.getElementById('mkstage').innerHTML=`<div class="frame ${s.dev}">${s.html()}</div>`;
  document.getElementById('mkprev').disabled=cur===0;document.getElementById('mknext').disabled=cur===S.length-1;
  try{history.replaceState(null,'','#s'+s.id)}catch(e){}
}
document.addEventListener('click',e=>{
  const r=e.target.closest('[data-req]');if(r){cur=S.findIndex(x=>x.req===r.dataset.req);draw();return}
  if(e.target.id==='mkprev'&&cur>0){cur--;draw()}
  if(e.target.id==='mknext'&&cur<S.length-1){cur++;draw()}
});
document.getElementById('mksel').addEventListener('change',e=>{cur=+e.target.value;draw()});
const hs=(location.hash||'').replace('#s','');const hi=S.findIndex(x=>x.id===hs);if(hi>=0)cur=hi;
draw();
})();
</script>
