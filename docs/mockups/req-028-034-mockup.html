<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vehicles and Amenities Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Layout: sticky top bar with role switch, left nav rail (horizontal strip on phones), content column of cards and tables. */
:root{
  --bg:#FFFFFF; --surface:#F4F8F5; --surface-2:#E9F2EC; --line:#DAE6DE; --fg:#13241B; --muted:#5A6D62;
  --accent:#1C7A4A; --accent-strong:#135B36; --accent-soft:#E2F1E8; --on-accent:#FFFFFF;
  --ok:#1C7A4A; --ok-bg:#E2F1E8; --warn:#8F5B00; --warn-bg:#FCF0D6; --bad:#B42318; --bad-bg:#FDE7E4; --info:#1F5E8C; --info-bg:#E3EEF8;
  --chart-2:#A9CDB8; --paper:#FFFFFF; --scrim:rgba(10,25,17,.45);
  --shadow:0 1px 2px rgba(19,36,27,.05),0 6px 20px rgba(19,36,27,.06);
  --f-head:"Plus Jakarta Sans",Inter,system-ui,sans-serif; --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--accent)}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:800}
h2{font-size:1.1rem;font-weight:700}
h3{font-size:.98rem;font-weight:700}
p{margin:0}
.num,td.money,.money{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--accent);color:var(--on-accent)}
.top .logo{background:var(--on-accent)} .top .logo svg{stroke:var(--accent)}
.top .brand small,.top .who,.top .who-admin{color:rgba(255,255,255,.8)}
.top .seg{background:rgba(255,255,255,.16)} .top .seg button{color:rgba(255,255,255,.85)}
.top .seg button[aria-pressed="true"]{background:var(--on-accent);color:var(--accent-strong)}
.top .bell{background:transparent;border-color:rgba(255,255,255,.4)} .top .bell svg{stroke:var(--on-accent)}
.top .who select{border-color:transparent}
.top .bellpanel{color:var(--fg)}
.top-in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px;stroke:var(--on-accent)}
.brand b{font-family:var(--f-head);font-size:1rem;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.75rem}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--accent-strong);box-shadow:var(--shadow)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.who select{max-width:220px}
.who-admin{font-size:.85rem;color:var(--muted)}
.bell{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center}
.bell svg{width:18px;height:18px;stroke:var(--fg)}
.bell .dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
.bellpanel{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(100% + 6px);width:min(360px,calc(100vw - 32px));background:var(--bg);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 32px rgba(0,0,0,.14);max-height:420px;overflow:auto}
.bellpanel header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.notif{padding:10px 14px;border-bottom:1px solid var(--line);font-size:.85rem}
.notif.unread{background:var(--accent-soft)}
.notif small{display:block;color:var(--muted)}

/* shell */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
nav.side{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);align-self:start}
nav.side .navlbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 12px 6px}
nav.side button{display:flex;justify-content:space-between;align-items:center;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--fg)}
nav.side button:hover{background:var(--surface)}
nav.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong);font-weight:700}
.badge{background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:.7rem;font-weight:700;padding:1px 7px}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
.menu-btn{display:none;width:38px;height:38px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:transparent;cursor:pointer;place-items:center;flex:none}
.menu-btn svg{width:20px;height:20px;stroke:var(--on-accent)}
.navscrim{position:fixed;inset:0;background:var(--scrim);z-index:39}
@media (max-width:860px){
  .shell{grid-template-columns:172px minmax(0,1fr);gap:16px;padding-block:16px 40px}
  nav.side button{padding:8px 10px;font-size:.88rem}
  .who span{display:none}
}
@media (max-width:640px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .menu-btn{display:grid}
  nav.side{position:fixed;top:0;bottom:0;left:0;width:min(280px,82vw);z-index:40;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 18px) 12px 18px max(12px,env(safe-area-inset-left,0px));box-shadow:4px 0 24px rgba(0,0,0,.18);transform:translateX(-105%);transition:transform .2s ease;overflow-y:auto;align-self:stretch}
  nav.side button{padding:11px 12px;font-size:.95rem}
  body.nav-open nav.side{transform:none}
}
@media (prefers-reduced-motion:reduce){nav.side{transition:none}}

/* building blocks */
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph p{color:var(--muted);margin-top:4px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0;display:flex;flex-direction:column;gap:14px}
.card.soft{background:var(--surface);border-color:transparent}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card-h p{color:var(--muted);font-size:.85rem}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-73{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1060px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g2,.g-73{grid-template-columns:minmax(0,1fr)}}
@media (max-width:420px){.tiles{grid-template-columns:minmax(0,1fr)}}
.tile{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile.hero{background:var(--accent);color:var(--on-accent)}
.tile.hero .tile-l,.tile.hero .tile-s{color:var(--on-accent);opacity:.85}
.tile-l{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.tile-v{font-family:var(--f-head);font-size:1.55rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.tile-s{font-size:.82rem;color:var(--muted)}
.tile .btn{margin-top:8px;align-self:flex-start}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.onhero{background:var(--on-accent);color:var(--accent-strong);border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad-bg)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:5px 10px;font-size:.8rem}
.btn.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:6px;flex-wrap:wrap}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)} .p-info{background:var(--info-bg);color:var(--info)}
.p-muted{background:var(--surface-2);color:var(--muted)}

.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--r);border:1px solid}
.alert.warn{background:var(--warn-bg);border-color:transparent;color:var(--fg)}
.alert.bad{background:var(--bad-bg);border-color:transparent}
.alert.info{background:var(--info-bg);border-color:transparent}
.alert b{display:block}
.alert .grow{flex:1;min-width:0}

.tbl{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.money,th.money{text-align:right;white-space:nowrap}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface)}
.sub{color:var(--muted);font-size:.78rem;display:block}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:.9rem}

form.f{display:flex;flex-direction:column;gap:12px}
label.fl{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-weight:400;color:var(--fg)}
input[type=file]{font-size:.8rem;color:var(--muted);max-width:100%}
textarea{min-height:84px;resize:vertical}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:480px){.row2{grid-template-columns:minmax(0,1fr)}}
.check{display:flex;gap:8px;align-items:center;font-size:.88rem}
.hint{font-size:.78rem;color:var(--muted);font-weight:400}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--accent-strong);border-bottom-color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--bg);padding:5px 12px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.8rem}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}

/* QR pay */
.qrwrap{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.qrbox{background:var(--paper);padding:10px;border-radius:12px;border:1px solid var(--line);width:180px;flex:none}
.qrbox canvas,.qrbox img{display:block;width:100%;height:auto;image-rendering:pixelated}
.qrbox .qrtag{color:#13241B;text-align:center;font-size:.68rem;font-weight:700;letter-spacing:.08em;margin-top:6px}
.payee{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.payee b{font-family:var(--f-head)}
.steps{margin:0;padding-left:18px;color:var(--muted);font-size:.82rem;display:flex;flex-direction:column;gap:2px}

/* amenities */
.amen{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.amen{grid-template-columns:repeat(2,minmax(0,1fr))}}
.amen button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.amen button b{font-family:var(--f-head)}
.amen button span{font-size:.8rem;color:var(--muted)}
.amen button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.cal-h{display:flex;justify-content:space-between;align-items:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;text-align:center;color:var(--muted);padding:4px 0}
.cal button{aspect-ratio:1/1;max-width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums;font-weight:600;font-size:.85rem;padding:0}
.cal button:disabled{opacity:.35;cursor:not-allowed}
.cal button .bar{width:60%;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.cal button .bar i{display:block;height:100%;background:var(--accent)}
.cal button.full .bar i{background:var(--bad)}
.cal button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.cal button[aria-pressed="true"] .bar{background:rgba(255,255,255,.35)}
.cal button.today{border-color:var(--accent)}
.legend{display:flex;gap:14px;font-size:.75rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:480px){.slots{grid-template-columns:minmax(0,1fr)}}
.slot{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;position:relative}
.slot input{position:absolute;opacity:0;pointer-events:none}
.slot-t{font-weight:700;font-variant-numeric:tabular-nums}
.slot-s{font-size:.75rem;color:var(--ok)}
.slot.taken{background:var(--surface);cursor:not-allowed}
.slot.taken .slot-s{color:var(--muted)}
.slot:has(input:checked){border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.slot:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.feebox{background:var(--surface);border-radius:8px;padding:10px 12px;font-size:.84rem}

/* vehicles */
.vlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.vcard{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.plate{background:var(--paper);color:#13241B;border:2px solid #13241B;border-radius:6px;padding:4px 10px 6px;text-align:center;align-self:flex-start;min-width:150px}
.plate small{display:block;font-size:.56rem;letter-spacing:.3em;font-weight:700;color:#1C7A4A}
.plate b{font-family:var(--f-head);font-size:1.3rem;letter-spacing:.08em}
.vmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* tickets */
details.tk{border:1px solid var(--line);border-radius:var(--r)}
details.tk summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
details.tk summary::-webkit-details-marker{display:none}
details.tk[open] summary{border-bottom:1px solid var(--line)}
.tk-body{padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.timeline{display:flex;flex-direction:column;gap:10px;border-left:2px solid var(--line);margin-left:4px;padding-left:14px}
.timeline div{position:relative;font-size:.85rem}
.timeline div::before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent);border:2px solid var(--bg)}
.timeline small{color:var(--muted);display:block}
.thumb{max-width:220px;border-radius:8px;border:1px solid var(--line)}

/* announcements */
.news{display:flex;flex-direction:column;gap:2px}
.news article{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.news article:last-child{border-bottom:0}
.news time{font-size:.75rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid line{stroke:var(--line)}
.hbar{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.84rem}
.hbar .track{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--accent);border-radius:5px}

.fund{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fund div{padding:14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.fund div:last-child{border-right:0;background:var(--accent-soft)}
.fund span{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.fund b{font-family:var(--f-head);font-size:1.1rem;font-variant-numeric:tabular-nums}
@media (max-width:760px){.fund{grid-template-columns:minmax(0,1fr)}.fund div{border-right:0;border-bottom:1px solid var(--line)}}

/* letter */
.letter{background:var(--paper);color:#1d1d1d;padding:36px 40px;border-radius:4px;border:1px solid var(--line);font-family:Georgia,"Times New Roman",serif;font-size:.92rem;line-height:1.6;display:flex;flex-direction:column;gap:12px}
.letter .lh{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #1C7A4A;padding-bottom:10px;flex-wrap:wrap}
.letter .lh b{font-family:var(--f-head);color:#135B36;font-size:1.05rem}
.letter .lh small{display:block;color:#555;font-family:var(--f-body);font-size:.75rem}
.letter h4{margin:4px 0 0;font-family:var(--f-head);letter-spacing:.06em;text-transform:uppercase;font-size:.95rem;color:#135B36}
.letter h4.final{color:#B42318}
.letter table{font-family:var(--f-body);font-size:.8rem;color:#1d1d1d}
.letter th{color:#555;border-color:#ddd}.letter td{border-color:#eee}
@media (max-width:560px){.letter{padding:20px}}

/* modal + toast */
.modal-wrap{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding-block:calc(env(safe-area-inset-top,0px) + 40px) 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--bg);border-radius:14px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
.modal.wide{width:min(760px,100%)}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:10px}
.modal-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.x{border:0;background:none;font-size:1.4rem;line-height:1;cursor:pointer;color:var(--muted)}
.proof{max-width:100%;max-height:70vh;margin:0 auto;display:block;border-radius:8px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:.88rem}

<script>
(function(){
"use strict";
const HOA='Greenfield Homes HOA';
const HOUSE='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>';
const BELL='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 004 0"/></svg>';
const MENU='<button class="menu-btn" aria-label="Open menu" type="button"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>';

function appTop(opts={}){
  const {menu=false,right='',sub='Resident portal'}=opts;

const bell=n=>`<button class="bell" aria-label="Notifications" type="button">${BELL}${n?`<span class="dot">${n}</span>`:''}</button>`;

const STAFFNAV=['Dashboard','Approvals','Homeowners','Announcements','Settings'];

const hoPage=(cur,body)=>hoTop()+shell(nav('Blk 4 Lot 12',HOMENAV,cur),body);
const stTop=who=>appTop({right:`<span class="who-admin">Signed in as <b>${who}</b></span>${bell(0)}`});

/* ---------- vehicles ---------- */
const plate=p=>`<div class="plate"><small>PILIPINAS</small><b>${p}</b></div>`;

  return `<div class="vcard">${plate(p)}<div><b>${make}</b><span class="sub">${sub}</span></div><div class="vmeta">${status}<span style="min-width:84px;text-align:right">${btn||'<button class="btn sm danger" type="button" style="visibility:hidden">Withdraw</button>'}</span></div>${reason?`<span class="sub" style="color:var(--bad)">${reason}</span>`:''}</div>`;
}
const myVehicles=()=>`<div class="vlist">

</div>`;
function vehForm(err){
  return `<section class="card"><h2>Register a vehicle</h2>

const amenBtns=cur=>`<p class="steplbl">1 · Choose an amenity</p><div class="amen" role="group" aria-label="Amenity">${AMEN.map(([n,f,g])=>`<button type="button" aria-pressed="${n===cur}"><b>${n}</b><span>${f}</span><span>${g}</span></button>`).join('')}</div>`;
function cal(sel,opts={}){
  const {full=[30],part={28:50,29:33,30:100}}=opts;
  let c='';
  for(let d=1;d<=30;d++){
    const dis=d<27;const p=part[d]||0;
    c+=`<button type="button" ${dis?'disabled':''} aria-pressed="${d===sel}" class="${d===27?'today':''} ${full.includes(d)?'full':''}" aria-label="Nov ${d}, 2026${dis?', past':''}">${d}<span class="bar"><i style="width:${p}%"></i></span></button>`;
  }
  return `<p class="steplbl">2 · Pick a date</p><div class="cal-h"><button class="btn sm" type="button" disabled aria-label="Previous month">‹</button><h2>November 2026</h2><button class="btn sm" type="button" aria-label="Next month">›</button></div>
  <div class="cal">${['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<span class="dow">${d}</span>`).join('')}${c}</div>
  <div class="legend"><span><i style="background:var(--accent)"></i>Slots taken</span><span><i style="background:var(--bad)"></i>Fully booked</span><span>Times are Manila time.</span></div>`;
}
function slots(list,checked){
  return `<div class="slots" role="radiogroup" aria-label="Slot">${list.map(([t,s],i)=>{const taken=s!=='Available';return `<label class="slot ${taken?'taken':''}" for="sl${i}"><input id="sl${i}" type="radio" name="slot" ${taken?'disabled':''} ${i===checked?'checked':''}><span class="slot-t">${t}</span><span class="slot-s">${s}</span></label>`}).join('')}</div>`;
}
const PICKLE29=[['06:00–07:00','Available'],['07:00–08:00','Available'],['16:00–17:00','On hold'],['17:00–18:00','Booked'],['18:00–19:00','Your booking'],['19:00–20:00','Available']];
const PICKLE28=[['06:00–07:00','Closed for requests'],['07:00–08:00','Closed for requests'],['16:00–17:00','Available'],['17:00–18:00','Booked'],['18:00–19:00','Available'],['19:00–20:00','On hold']];
function bookForm(o={}){
  const {date='Sunday, Nov 29, 2026',list=PICKLE29,checked=1,guests='4',gErr='',alert='',btn='Request booking',btnDis=false,fee='Fee ₱200.00. You pay after the admin office approves.',extra=''}=o;
  return `<section class="card"><p class="steplbl">3 · Choose a slot and confirm</p><div class="card-h"><h2>Pickleball Court</h2><p>${date}</p></div>
  ${alert}
  <form class="f" onsubmit="return false">${slots(list,checked)}
  <div class="row2"><label class="fl" for="bkG">Guests (up to 8)<input id="bkG" type="number" inputmode="numeric" min="1" max="8" value="${guests}" class="${gErr?'bad':''}">${gErr?`<span class="ferr">${gErr}</span>`:''}</label>
  <label class="fl" for="bkP">Purpose (optional)<input id="bkP" type="text" value="Doubles"></label></div>
  <div class="feebox">${fee}</div>${extra}
  <button class="btn primary big" type="button" ${btnDis?'disabled':''}>${btn}</button></form></section>`;
}
function bkcard(a,when,meta,status,acts){
  return `<div class="bkcard"><div class="r"><b>${a}</b>${status}</div><span class="sub">${when}</span><span class="sub">${meta}</span><div class="acts">${acts||'<button class="btn sm danger ghost" type="button" tabindex="-1" aria-hidden="true">Cancel</button>'}</div></div>`;
}
const CANCEL='<button class="btn sm danger" type="button">Cancel</button>';
const QR=(()=>{let r='';let s=7;for(let y=0;y<21;y++)for(let x=0;x<21;x++){s=(s*73+19)%101;const corner=(x<7&&y<7)||(x>13&&y<7)||(x<7&&y>13);const on=corner?((x%6===0||y%6===0||(x>13&&(x===14||x===20)))||((x>1&&x<5||x>15&&x<19)&&(y>1&&y<5||y>15&&y<19))):s%2===0;if(on)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}return `<svg class="qrph" viewBox="0 0 21 21" role="img" aria-label="Sample QR Ph code (not real)" fill="#13241B">${r}</svg>`})();

const REQS=[['REQ-028','Register vehicle'],['REQ-029','Approve vehicle'],['REQ-030','Amenity setup'],['REQ-031','Book'],['REQ-032','Approve booking'],['REQ-033','Cancel'],['REQ-034','Booking pause'],['Copy','Copy of record']];
let cur=0;
function draw(){
  const s=S[cur];
  document.getElementById('mkreq').innerHTML=REQS.map(([r,l])=>`<button type="button" data-req="${r}" aria-pressed="${s.req===r}">${r==='Copy'?l:r+' · '+l}</button>`).join('');
  document.getElementById('mksel').innerHTML=S.map((x,i)=>`<option value="${i}" ${i===cur?'selected':''}>${x.id} · ${x.title}</option>`).join('');
  document.getElementById('mkinfo').innerHTML=`<span class="k">${s.req==='Copy'?'All REQs':s.req+' · Screen '+s.id}</span><h2>${s.title}</h2><div><span class="mkopt ${s.opt}">${s.opt==='rec'?'Recommended option':'Alternative option, for comparison'}</span></div><p><b>Shows:</b> ${s.scn}</p><p class="mknote">${s.note}</p>`;
  document.getElementById('mkstage').innerHTML=`<div class="frame ${s.dev}">${s.html()}</div>`;
  document.getElementById('mkprev').disabled=cur===0;document.getElementById('mknext').disabled=cur===S.length-1;
  try{history.replaceState(null,'','#s'+s.id)}catch(e){}
}
document.addEventListener('click',e=>{
  const r=e.target.closest('[data-req]');if(r){cur=S.findIndex(x=>x.req===r.dataset.req);draw();return}
  if(e.target.id==='mkprev'&&cur>0){cur--;draw()}
  if(e.target.id==='mknext'&&cur<S.length-1){cur++;draw()}
});
document.getElementById('mksel').addEventListener('change',e=>{cur=+e.target.value;draw()});
const hs=(location.hash||'').replace('#s','');const hi=S.findIndex(x=>x.id===hs);if(hi>=0)cur=hi;
draw();
})();
</script>
