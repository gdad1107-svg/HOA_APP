<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guest Passes and Gate Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* The app's own tokens and components, copied from the mock-up (index.html) via req-001-004-access-mockup.html. */
:root{
  --bg:#FFFFFF; --surface:#F4F8F5; --surface-2:#E9F2EC; --line:#DAE6DE; --fg:#13241B; --muted:#5A6D62;
  --accent:#1C7A4A; --accent-strong:#135B36; --accent-soft:#E2F1E8; --on-accent:#FFFFFF;
  --ok:#1C7A4A; --ok-bg:#E2F1E8; --warn:#8F5B00; --warn-bg:#FCF0D6; --bad:#B42318; --bad-bg:#FDE7E4; --info:#1F5E8C; --info-bg:#E3EEF8;
  --paper:#FFFFFF; --scrim:rgba(10,25,17,.45);
  --shadow:0 1px 2px rgba(19,36,27,.05),0 6px 20px rgba(19,36,27,.06);
  --f-head:"Plus Jakarta Sans",Inter,system-ui,sans-serif; --f-body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:10px; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#EEF3F0;color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:1.6rem;font-weight:800} h2{font-size:1.1rem;font-weight:700} h3{font-size:.98rem;font-weight:700}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:relative;z-index:20;background:var(--accent);color:var(--on-accent)}
.top-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:34px;height:34px;border-radius:9px;background:var(--on-accent);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px;stroke:var(--accent)}
.brand b{font-family:var(--f-head);font-size:1rem;display:block;line-height:1.1}
.brand small{color:rgba(255,255,255,.8);font-size:.75rem}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.who-admin{font-size:.85rem;color:rgba(255,255,255,.85)}
.bell{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:transparent;display:grid;place-items:center}
.bell svg{width:18px;height:18px;stroke:var(--on-accent)}
.bell .dot{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
.menu-btn{width:38px;height:38px;border-radius:8px;border:1px solid rgba(255,255,255,.4);background:transparent;display:grid;place-items:center;flex:none}
.menu-btn svg{width:20px;height:20px;stroke:var(--on-accent)}

.shell{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;padding:24px 16px 40px}
nav.side{display:flex;flex-direction:column;gap:2px}
nav.side .navlbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 12px 6px}
nav.side button{text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:8px;font-weight:500}
nav.side button[aria-current="page"]{background:var(--accent-soft);color:var(--accent-strong);font-weight:700}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.pad{padding:16px;display:flex;flex-direction:column;gap:14px}

.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ph p{color:var(--muted);margin-top:4px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card-h p{color:var(--muted);font-size:.85rem}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:2px}
.tile-l{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.tile-v{font-family:var(--f-head);font-size:1.5rem;font-weight:800}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;white-space:nowrap;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:var(--bad-bg)}
.btn.sm{padding:5px 10px;font-size:.8rem;min-height:32px}
.btn.big{min-height:48px;width:100%;font-size:1rem}
.btn.link{border:0;background:none;padding:0;min-height:0;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)} .p-info{background:var(--info-bg);color:var(--info)}
.p-muted{background:var(--surface-2);color:var(--muted)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r)}
.alert.warn{background:var(--warn-bg)} .alert.bad{background:var(--bad-bg)} .alert.info{background:var(--info-bg)}
.alert b{display:block} .alert .grow{flex:1;min-width:0}

.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.sub{color:var(--muted);font-size:.78rem;display:block}
.empty{color:var(--muted);text-align:center;padding:24px 8px;font-size:.9rem}

form.f{display:flex;flex-direction:column;gap:12px}
label.fl,.fl{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=search],select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-weight:400;color:var(--fg);min-height:44px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.hint{font-size:.78rem;color:var(--muted);font-weight:400}
.ferr{color:var(--bad);font-size:.78rem;font-weight:600;min-height:1.2em}
input.bad{border-color:var(--bad)!important;box-shadow:0 0 0 1px var(--bad)}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
legend{font-size:.8rem;font-weight:600;color:var(--muted);margin-bottom:4px;padding:0}
.dyn{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:end}
.dyn .x{width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:1.2rem;color:var(--muted)}
.check{display:flex;gap:8px;align-items:center;font-size:.88rem;font-weight:600;color:var(--fg)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent-strong);border-bottom-color:var(--accent)}

.passes{display:flex;flex-direction:column;gap:10px}
.pass{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;gap:12px;align-items:flex-start}
.pass.dim{opacity:.7}
.pass .qr{width:72px;height:72px;flex:none;border:1px solid var(--line);border-radius:6px;background:#fff;padding:3px}
.pass .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.qrbig{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;align-self:center;width:min(240px,100%)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:1.35rem;font-weight:700;letter-spacing:.12em;text-align:center}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;font-size:.88rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}

.verdict{border-radius:var(--r);padding:14px 16px;display:flex;gap:14px;align-items:center}
.verdict b{font-family:var(--f-head);font-size:1.4rem;display:block;line-height:1.2}
.verdict.ok{background:var(--accent);color:#fff}
.verdict.bad{background:var(--bad);color:#fff}
.verdict.warn{background:var(--warn-bg);color:var(--fg);border:2px solid var(--warn)}
.verdict .ic{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:1.5rem;font-weight:800;flex:none}
.verdict.warn .ic{background:var(--warn);color:#fff}
.gst{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px}
.gst-h{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.gst-h b{font-size:1rem}
.cam{position:relative;background:#0d1a13;border-radius:12px;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;color:#cfe3d7}
.cam .vf{width:58%;aspect-ratio:1;position:relative}
.cam .vf i{position:absolute;width:26px;height:26px;border:4px solid #fff}
.cam .vf i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}.cam .vf i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.cam .vf i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}.cam .vf i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.cam .lbl{position:absolute;bottom:10px;left:0;right:0;text-align:center;font-size:.82rem}
.codein{font-family:ui-monospace,SFMono-Regular,Menlo,monospace!important;font-size:1.15rem!important;letter-spacing:.12em;text-transform:uppercase}
.photo{width:100%;max-width:240px;aspect-ratio:1.58;border-radius:8px;background:linear-gradient(135deg,#e8eef6,#cbd8e6);border:1px solid var(--line);display:grid;place-items:center;color:#55667a;font-size:.8rem;font-weight:600}

.modal-wrap{position:absolute;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px}
.modal{background:var(--bg);border-radius:14px;width:min(520px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:10px}
.modal-b{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.x{border:0;background:none;font-size:1.4rem;line-height:1;color:var(--muted);min-width:44px;min-height:44px}
.toast{background:var(--fg);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:.88rem;align-self:center}
.notif{padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:.85rem;background:var(--accent-soft)}
.notif small{display:block;color:var(--muted)}
.hocard{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.hocard .r{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.passimg{width:100%;max-width:420px;margin:24px auto;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff}
.passimg .hd{background:var(--accent);color:#fff;padding:18px 22px}
.passimg .hd b{font-family:var(--f-head);font-size:1.2rem;display:block}
.passimg .bd{padding:18px 22px;display:flex;flex-direction:column;gap:12px}
.passimg .ft{margin:0 18px 18px;background:var(--accent-soft);color:var(--accent-strong);font-weight:600;padding:10px 12px;border-radius:6px;font-size:.85rem}

/* Mockup viewer */
.mkbar{position:sticky;top:0;z-index:80;background:#13241B;color:#fff;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.mkbar h1{font-size:1.05rem;color:#fff}
.mkbar p{font-size:.8rem;color:rgba(255,255,255,.75)}
.mkrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mkrow select{width:auto;max-width:100%;min-height:34px;background:#fff;color:#13241B}
.mkrow .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.35)}
.mkreq{display:flex;gap:6px;flex-wrap:wrap}
.mkreq button{border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:999px;padding:4px 12px;font-weight:600;font-size:.8rem;cursor:pointer}
.mkreq button[aria-pressed="true"]{background:#fff;color:#13241B}
.mkwrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:14px}
.mkinfo{background:#fff;border:1px solid #D2DFD7;border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.mkinfo .k{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:#135B36}
.mkinfo p{font-size:.86rem;color:#3d4f45}
.mkopt{display:inline-flex;font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 10px}
.mkopt.rec{background:#E2F1E8;color:#135B36}.mkopt.alt{background:#FCF0D6;color:#8F5B00}
.frame{background:#fff;border:1px solid #C9D8CF;border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(19,36,27,.08);position:relative;align-self:center;width:100%}
.frame.phone{max-width:390px;border-radius:28px;border:8px solid #13241B;min-height:640px}
.frame.desk{max-width:1180px;min-height:520px}
.frame.paper{max-width:720px;border-radius:4px;background:#EEF3F0}
.callout{font-size:.75rem;font-weight:700;color:#8F5B00;background:#FCF0D6;border-radius:6px;padding:4px 8px;align-self:flex-start}
.banner{background:#FCF0D6;color:#13241B;border-radius:8px;padding:8px 12px;font-size:.82rem}
</style>

<div class="mkbar">
  <div><h1>Guest passes and gate mockup · REQ-040 to REQ-045</h1><p>Draft for owner review. <b>Blocked by board decision D9</b> (is the gate add-on in scope). Sample HOA and invented people only. The QR codes are drawings and do not scan. Each screen names the REQ scenario it shows.</p></div>
  <div class="mkrow"><div class="mkreq" id="mkreq" role="group" aria-label="Requirement"></div></div>
  <div class="mkrow">
    <label for="mksel" style="font-size:.8rem;color:rgba(255,255,255,.8)">Screen</label>
    <select id="mksel"></select>
    <button class="btn sm" id="mkprev" type="button">&lsaquo; Previous</button>
    <button class="btn sm" id="mknext" type="button">Next &rsaquo;</button>
  </div>
</div>
<div class="mkwrap">
  <div class="mkinfo" id="mkinfo"></div>
  <div id="mkstage" style="display:flex;flex-direction:column"></div>
</div>

<script>
(function(){
"use strict";
const HOA='Greenfield Homes HOA';
const HOUSE='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>';
const BELL='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1112 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 20a2 2 0 004 0"/></svg>';
const MENU='<button class="menu-btn" aria-label="Open menu" type="button"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>';

function header(sub,right,menu){
  return `<header class="top"><div class="top-in">${menu?MENU:''}<div class="brand"><span class="logo">${HOUSE}</span><div><b>${HOA}</b><small>${sub}</small></div></div><div class="top-r">${right||''}</div></div></header>`;
}
const bell=n=>`<button class="bell" aria-label="Notifications" type="button">${BELL}${n?`<span class="dot">${n}</span>`:''}</button>`;
const hoTop=(n)=>header('Resident portal',bell(n||0),true);
const gdTop=()=>header('Guard · Main Gate',`<span class="who-admin">Ramil S.</span>`,true);
const adTop=()=>header('Administration',`<span class="who-admin">Signed in as <b>Paolo Aquino</b></span>${bell(0)}`,false);
const ADNAV=['Dashboard','Approvals','Homeowners','Visitor Log','Announcements','Settings'];
function nav(items,cur){return `<nav class="side" aria-label="Sections"><div class="navlbl">Administration</div>${items.map(i=>`<button type="button" ${i===cur?'aria-current="page"':''}>${i}</button>`).join('')}</nav>`}
const shell=(cur,m)=>`<div class="shell">${nav(ADNAV,cur)}<main>${m}</main></div>`;
const ph=(t,s,r)=>`<div class="ph"><div><h1>${t}</h1>${s?`<p>${s}</p>`:''}</div>${r?`<div class="actions">${r}</div>`:''}</div>`;
const pill=(k,t)=>`<span class="pill p-${k}">${t}</span>`;
const PS={Valid:pill('ok','Valid'),Upcoming:pill('info','Upcoming'),Expired:pill('muted','Expired'),Cancelled:pill('bad','Cancelled'),Invalid:pill('bad','Invalid')};

/* Illustrative QR drawing (deterministic pattern, not a real QR code). */
function qrSvg(seed){
  const n=25;let s=seed>>>0;const rnd=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296};
  let r='';
  const finder=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#000"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#000"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){
    const inF=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);
    if(!inF&&rnd()>.52)r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#000"/>`;
  }
  return `<svg viewBox="-2 -2 ${n+4} ${n+4}" role="img" aria-label="QR code (illustration)" style="display:block;width:100%;height:auto;shape-rendering:crispEdges"><rect x="-2" y="-2" width="${n+4}" height="${n+4}" fill="#fff"/>${r}${finder(0,0)}${finder(n-7,0)}${finder(0,n-7)}</svg>`;
}

const passCard=(id,st,dates,guests,plates,extra,seed)=>`<div class="pass ${['Valid','Upcoming'].includes(st)?'':'dim'}">${st==='Cancelled'?`<div class="qr" style="display:grid;place-items:center;font-size:.65rem;color:var(--muted);text-align:center">Cancelled</div>`:`<div class="qr">${qrSvg(seed)}</div>`}<div class="grow"><div class="card-h" style="gap:6px"><b>${id}</b>${PS[st]}</div><span class="sub">${dates}</span><span style="font-size:.85rem">${guests}</span>${plates?`<span class="sub">${plates}</span>`:''}${extra||''}</div></div>`;

function passesPage(){
  return hoTop(0)+`<div class="pad">${ph('Guest Passes','Create a pass for your visitors. The guard checks it at the gate.')}
  <button class="btn primary big" type="button">New guest pass</button>
  <section class="card"><div class="card-h"><h2>Active and upcoming</h2><p>2 passes</p></div><div class="passes">
   ${passCard('GP-1041','Valid','Fri, Nov 27 · Family visit','Rosa Dela Cruz, Miguel Dela Cruz','NDA4471','<span class="sub" style="color:var(--ok);font-weight:600">1 of 2 arrived</span>',41)}
   ${passCard('GP-1043','Upcoming','Sat, Dec 5 · Party or event','Tess Ramos, Carlo Ramos, Jun Ramos, Liza Ramos','ABE2210','',43)}
  </div></section>
  <section class="card"><div class="card-h"><h2>Past passes</h2></div><div class="passes">
   ${passCard('GP-1030','Expired','Sat, Nov 21 · Friends','Lito Garcia','','<span class="sub">1 of 1 arrived</span>',30)}
  </div></section></div>`;
}
function newPass(){
  return hoTop(0)+`<div class="pad">${ph('New guest pass','Visiting Blk 4 Lot 12')}
  <div class="alert info"><div class="grow">Your guests' names and plates are shared with the HOA's guards. Let your guests know the guard will check their ID at the gate. <button class="btn link" type="button">How the HOA uses visitor information</button></div></div>
  <form class="f" onsubmit="return false">
   <div class="row2"><label class="fl" for="d1">Visit date<input id="d1" type="date" value="2026-11-27"></label>
   <label class="fl" for="d2">Valid until<input id="d2" type="date" value="2026-12-02" class="bad" aria-describedby="d2e"><span class="hint">Up to 3 days</span><span class="ferr" id="d2e" role="alert">A guest pass can cover up to 3 days.</span></label></div>

  <label class="check" style="opacity:.6"><input type="checkbox" disabled> Require an ID photo at check-in</label><span class="hint">Available once the daily ID photo cleanup is running.</span>
  <span class="callout">Lengthening the period</span><div class="alert info"><div class="grow">Photos already deleted can't be brought back. Newer photos will be kept for 60 days.</div></div>
  <span class="callout">Out of range</span><label class="fl" for="s7">Keep ID photos for (days)<input id="s7" type="number" class="bad" value="120"><span class="ferr" role="alert">Choose between 7 and 90 days.</span></label></section>`);
}
function cleanupHealth(){
  return adTop()+shell('Visitor Log',ph('Visitor Log','Every guest let in at the gate, and every pass check.')+
  `<span class="callout">Healthy</span><p class="hint">Last ID photo cleanup: Nov 12, 2:00 AM · 3 deleted</p>
  <span class="callout">Late</span><div class="alert warn" role="alert"><div class="grow"><b>The daily ID photo cleanup hasn't run since Nov 10, 2:00 AM.</b>Tell the developer. Photos are still deleted by a backstop after 91 days.</div></div>
  <section class="card"><div class="tbl"><table><thead><tr><th>Date</th><th>Guest</th><th>Visiting</th><th>ID</th></tr></thead><tbody><tr><td>Oct 12</td><td><b>Pedro Santos</b></td><td>Blk 7 Lot 4</td><td>UMID<span class="sub">Deleted</span></td></tr></tbody></table></div></section>`);
}

{id:'45B',req:'REQ-045',dev:'desk',opt:'rec',title:'Photo switch locked, lengthening, out of range',scn:'"Photos can\'t be switched on before the cleanup is set up", "Lengthening the retention period", "A period outside the allowed range".',note:'States stacked.',html:settingsOff},
{id:'45C',req:'REQ-045',dev:'desk',opt:'rec',title:'Cleanup health on the Visitor Log',scn:'"When the cleanup last ran", "The cleanup stops running", "Old photos are deleted on schedule".',note:'The late warning also fires the developer\'s alert.',html:cleanupHealth},
{id:'CR',req:'Copy',dev:'desk',opt:'rec',title:'Copy of record (key lines)',scn:'Wording to comment on.',note:'Full tables are in each REQ.',html:copyTable}
];
const REQS=[['REQ-040','Create'],['REQ-041','Cancel'],['REQ-042','Verify'],['REQ-043','Check in/out'],['REQ-044','Logs'],['REQ-045','Retention'],['Copy','Copy of record']];
let cur=0;
function draw(){
  const s=S[cur];
  document.getElementById('mkreq').innerHTML=REQS.map(([r,l])=>`<button type="button" data-req="${r}" aria-pressed="${s.req===r}">${r==='Copy'?l:r+' · '+l}</button>`).join('');
  document.getElementById('mksel').innerHTML=S.map((x,i)=>`<option value="${i}" ${i===cur?'selected':''}>${x.id} · ${x.title}</option>`).join('');
  document.getElementById('mkinfo').innerHTML=`<span class="k">${s.req} · Screen ${s.id}</span><h2>${s.title}</h2><div><span class="mkopt ${s.opt}">${s.opt==='rec'?'Recommended option':'Alternative option, for comparison'}</span></div><p><b>Shows:</b> ${s.scn}</p><p>${s.note}</p><p class="banner">Blocked by D9: nothing here is built until the HOA board puts the gate add-on in scope.</p>`;
  document.getElementById('mkstage').innerHTML=`<div class="frame ${s.dev}">${s.html()}</div>`;
  document.getElementById('mkprev').disabled=cur===0;document.getElementById('mknext').disabled=cur===S.length-1;
  try{history.replaceState(null,'','#s'+s.id)}catch(e){}
}
document.addEventListener('click',e=>{
  const r=e.target.closest('[data-req]');if(r){cur=S.findIndex(x=>x.req===r.dataset.req);draw();return}
  if(e.target.id==='mkprev'&&cur>0){cur--;draw()}
  if(e.target.id==='mknext'&&cur<S.length-1){cur++;draw()}
});
document.getElementById('mksel').addEventListener('change',e=>{cur=+e.target.value;draw()});
const h=(location.hash||'').replace('#s','');const hi=S.findIndex(x=>x.id===h);if(hi>=0)cur=hi;
draw();
})();
</script>
